<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブログ - redred.me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #fff6e9;
      --card: #fffdf8;
      --ink: #432411;
      --orange: #f08a1d;
      --red: #c2410c;
      --deep: #a33b0b;
      --amber: #ffc24b;
      --line: #f3ddc0;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Zen Maru Gothic", sans-serif;
      background: var(--bg);
      margin: 0;
      color: var(--ink);
      line-height: 1.9;
    }

    /* 画面幅いっぱいのヘッダーバー（index.html と共通デザイン） */
    .site-header {
      background: var(--card);
      border-bottom: 3px solid var(--amber);
    }
    .header-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      text-decoration: none;
    }
    .brand-name {
      display: block;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--red);
      letter-spacing: 0.04em;
      line-height: 1.3;
    }
    .tagline {
      display: block;
      font-size: 0.78rem;
      color: var(--deep);
      opacity: 0.75;
    }
    .brand .gecko {
      width: 130px;
      display: block;
      image-rendering: pixelated;
    }
    .site-header nav a {
      display: inline-block;
      padding: 7px 20px;
      border-radius: 999px;
      background: var(--orange);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 3px 0 var(--deep);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .site-header nav a:hover {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--deep);
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    a.back {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--red);
      text-decoration: none;
      font-weight: 700;
    }
    a.back:hover { text-decoration: underline; }

    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px 28px;
    }

    .post-date {
      font-size: 0.85rem;
      color: var(--deep);
      opacity: 0.7;
      margin-bottom: 4px;
    }

    article h1 {
      font-size: 1.7rem;
      font-weight: 900;
      color: var(--red);
      border-bottom: 3px solid var(--amber);
      padding-bottom: 8px;
      margin: 0 0 24px;
    }
    article h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--deep);
      border-left: 5px solid var(--orange);
      padding-left: 10px;
      margin: 32px 0 12px;
    }
    article h3 {
      font-size: 1.05rem;
      color: var(--deep);
      margin: 24px 0 8px;
    }
    article img {
      max-width: 100%;
      border-radius: 8px;
    }
    article a { color: var(--red); }
    article blockquote {
      margin: 16px 0;
      padding: 8px 16px;
      border-left: 4px solid var(--amber);
      background: var(--bg);
      border-radius: 0 8px 8px 0;
    }
    article code {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.9em;
    }
    article pre {
      background: #432411;
      color: #ffe9c9;
      padding: 16px;
      border-radius: 10px;
      overflow-x: auto;
    }
    article pre code {
      background: none;
      border: none;
      padding: 0;
      color: inherit;
    }
    article hr {
      border: none;
      border-top: 2px dashed var(--line);
      margin: 28px 0;
    }

    #error {
      color: var(--deep);
      text-align: center;
      padding: 40px 0;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span>
          <span class="brand-name">redred.me</span>
          <span class="tagline">レオパと暮らす日々のきろく</span>
        </span>
        <img class="gecko" src="IMG_1169.GIF" alt="うちのレオパ">
      </a>
      <nav>
        <a href="weather.html">天気を見る</a>
      </nav>
    </div>
  </header>

  <div class="wrap">
    <a class="back" href="index.html">&larr; トップにもどる</a>
    <article>
      <div class="post-date" id="date"></div>
      <div id="content"><p id="error">読み込み中…</p></div>
    </article>
  </div>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const name = params.get("f") || "";
    const content = document.getElementById("content");

    function showError(msg) {
      content.innerHTML = "";
      const p = document.createElement("p");
      p.id = "error";
      p.textContent = msg;
      content.appendChild(p);
    }

    // posts/ 直下のファイル名だけを許可（パス移動を防ぐ）
    if (!/^[\w\-. ぁ-んァ-ヶ一-龠々ー]+\.md$/i.test(name)) {
      showError("記事が見つかりません。");
      return;
    }

    const m = name.match(/^(\d{4}-\d{2}-\d{2})/);
    if (m) document.getElementById("date").textContent = m[1];

    fetch("posts/" + encodeURIComponent(name))
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(md => {
        const html = DOMPurify.sanitize(marked.parse(md));
        content.innerHTML = html;
        const h1 = content.querySelector("h1");
        if (h1) document.title = h1.textContent + " - redred.me";
      })
      .catch(() => showError("記事を読み込めませんでした。"));
  })();
  </script>
</body>
</html>
