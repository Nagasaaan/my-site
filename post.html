<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>ブログ - redred.me</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --accent: #d9480f;
      --accent-soft: rgba(217, 72, 15, 0.1);
      --separator: rgba(0, 0, 0, 0.08);
      --header-bg: rgba(255, 255, 255, 0.72);
      --row-hover: rgba(0, 0, 0, 0.035);
      --code-bg: rgba(0, 0, 0, 0.045);
      --radius-lg: 20px;
      --radius-md: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f5f5f7;
        --text-secondary: #98989d;
        --accent: #ff8a4c;
        --accent-soft: rgba(255, 138, 76, 0.16);
        --separator: rgba(255, 255, 255, 0.12);
        --header-bg: rgba(28, 28, 30, 0.72);
        --row-hover: rgba(255, 255, 255, 0.06);
        --code-bg: rgba(255, 255, 255, 0.08);
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro JP", "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      background: var(--bg);
      margin: 0;
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--header-bg);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--separator);
    }
    .header-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      min-width: 0;
    }
    .brand .gecko {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      object-fit: cover;
      display: block;
      flex: none;
      box-shadow: 0 0 0 0.5px var(--separator);
    }
    .brand-text { min-width: 0; }
    .brand-name {
      display: block;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .tagline {
      display: block;
      font-size: 0.72rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .site-header nav { display: flex; gap: 4px; }
    .site-header nav a {
      display: inline-flex;
      align-items: center;
      padding: 7px 14px;
      border-radius: 980px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.88rem;
      transition: background 0.15s ease;
      white-space: nowrap;
    }
    .site-header nav a:hover { background: var(--accent-soft); }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    a.back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 20px;
      margin-left: 4px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.92rem;
    }
    a.back:hover { text-decoration: underline; }

    article {
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .post-date {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    article h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 20px;
    }
    article h2 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 32px 0 12px;
    }
    article h3 {
      font-size: 1.08rem;
      font-weight: 600;
      margin: 24px 0 8px;
    }
    article p { margin: 0 0 16px; }
    article img {
      max-width: 100%;
      border-radius: var(--radius-md);
    }
    article a { color: var(--accent); }
    article ul, article ol { padding-left: 1.4em; }
    article li { margin-bottom: 6px; }
    article blockquote {
      margin: 16px 0;
      padding: 4px 16px;
      border-left: 3px solid var(--accent);
      color: var(--text-secondary);
    }
    article code {
      background: var(--code-bg);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 0.9em;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    article pre {
      background: var(--code-bg);
      padding: 16px;
      border-radius: var(--radius-md);
      overflow-x: auto;
    }
    article pre code {
      background: none;
      padding: 0;
    }
    article hr {
      border: none;
      border-top: 1px solid var(--separator);
      margin: 28px 0;
    }

    #error {
      color: var(--text-secondary);
      text-align: center;
      padding: 40px 0;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <img class="gecko" src="IMG_1169.GIF" alt="うちのレオパ">
        <span class="brand-text">
          <span class="brand-name">redred.me</span>
          <span class="tagline">レオパと暮らす日々のきろく</span>
        </span>
      </a>
      <nav>
        <a href="GalaxyDrive.html">Galaxy Drive</a>
        <a href="weather.html">天気</a>
      </nav>
    </div>
  </header>

  <div class="wrap">
    <a class="back" href="index.html">&larr; トップにもどる</a>
    <article>
      <div class="post-date" id="date"></div>
      <div id="content"><p id="error">読み込み中…</p></div>
    </article>
  </div>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const name = params.get("f") || "";
    const content = document.getElementById("content");

    function showError(msg) {
      content.innerHTML = "";
      const p = document.createElement("p");
      p.id = "error";
      p.textContent = msg;
      content.appendChild(p);
    }

    // posts/ 直下のファイル名だけを許可（パス移動を防ぐ）
    if (!/^[\w\-. ぁ-んァ-ヶ一-龠々ー]+\.md$/i.test(name)) {
      showError("記事が見つかりません。");
      return;
    }

    const m = name.match(/^(\d{4}-\d{2}-\d{2})/);
    if (m) document.getElementById("date").textContent = m[1];

    fetch("posts/" + encodeURIComponent(name))
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(md => {
        const html = DOMPurify.sanitize(marked.parse(md));
        content.innerHTML = html;
        const h1 = content.querySelector("h1");
        if (h1) document.title = h1.textContent + " - redred.me";
      })
      .catch(() => showError("記事を読み込めませんでした。"));
  })();
  </script>
</body>
</html>
