<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>redred.me</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --accent: #d9480f;
      --accent-soft: rgba(217, 72, 15, 0.1);
      --separator: rgba(0, 0, 0, 0.08);
      --header-bg: rgba(255, 255, 255, 0.72);
      --row-hover: rgba(0, 0, 0, 0.035);
      --radius-lg: 20px;
      --radius-md: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f5f5f7;
        --text-secondary: #98989d;
        --accent: #ff8a4c;
        --accent-soft: rgba(255, 138, 76, 0.16);
        --separator: rgba(255, 255, 255, 0.12);
        --header-bg: rgba(28, 28, 30, 0.72);
        --row-hover: rgba(255, 255, 255, 0.06);
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro JP", "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      background: var(--bg);
      margin: 0;
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* すりガラス調のスティッキーヘッダー */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--header-bg);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--separator);
    }
    .header-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      min-width: 0;
    }
    .brand .gecko {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      object-fit: cover;
      display: block;
      flex: none;
      box-shadow: 0 0 0 0.5px var(--separator);
    }
    .brand-text { min-width: 0; }
    .brand-name {
      display: block;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .tagline {
      display: block;
      font-size: 0.72rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-header nav {
      display: flex;
      gap: 4px;
    }
    .site-header nav a {
      display: inline-flex;
      align-items: center;
      padding: 7px 14px;
      border-radius: 980px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.88rem;
      transition: background 0.15s ease;
      white-space: nowrap;
    }
    .site-header nav a:hover {
      background: var(--accent-soft);
    }

    main.wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    section.blog h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 14px;
      padding: 0 4px;
    }

    /* Apple のグループ化リスト風 */
    #post-list {
      list-style: none;
      margin: 0;
      padding: 0;
      background: var(--card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    #post-list li + li { border-top: 1px solid var(--separator); }
    #post-list li a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      text-decoration: none;
      color: var(--text);
      transition: background 0.12s ease;
    }
    #post-list li a:hover { background: var(--row-hover); }
    #post-list .post-title {
      font-weight: 500;
      font-size: 1rem;
    }
    #post-list .post-date {
      font-size: 0.85rem;
      color: var(--text-secondary);
      flex: none;
    }
    #post-list li a::after {
      content: "";
      flex: none;
      width: 8px;
      height: 8px;
      border-right: 1.6px solid var(--text-secondary);
      border-bottom: 1.6px solid var(--text-secondary);
      transform: rotate(-45deg);
      opacity: 0.5;
    }
    #post-status {
      color: var(--text-secondary);
      font-size: 0.92rem;
      padding: 4px;
    }

    footer {
      text-align: center;
      padding: 32px 0 40px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <img class="gecko" src="IMG_1169.GIF" alt="うちのレオパ">
        <span class="brand-text">
          <span class="brand-name">redred.me</span>
          <span class="tagline">レオパと暮らす日々のきろく</span>
        </span>
      </a>
      <nav>
        <a href="GalaxyDrive.html">Galaxy Drive</a>
        <a href="weather.html">天気</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="blog">
      <h2>ブログ</h2>
      <p id="post-status">記事を読み込み中…</p>
      <ul id="post-list"></ul>
    </section>
  </main>

  <footer>&copy; 2026 redred.me</footer>

  <script>
  // ブログ記事一覧: リポジトリの posts/ フォルダに .md を追加するだけで記事になる
  (function () {
    const REPO = "Nagasaaan/my-site";
    const list = document.getElementById("post-list");
    const status = document.getElementById("post-status");

    function parseDate(name) {
      const m = name.match(/^(\d{4}-\d{2}-\d{2})/);
      return m ? m[1] : "";
    }

    function fallbackTitle(name) {
      return name.replace(/^\d{4}-\d{2}-\d{2}-?/, "").replace(/\.md$/i, "").replace(/[-_]/g, " ");
    }

    fetch("https://api.github.com/repos/" + REPO + "/contents/posts")
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(files => {
        const posts = files
          .filter(f => f.type === "file" && /\.md$/i.test(f.name))
          .sort((a, b) => b.name.localeCompare(a.name));

        if (posts.length === 0) {
          status.textContent = "まだ記事がありません。posts/ フォルダに .md ファイルを追加すると表示されます。";
          return;
        }

        return Promise.all(posts.map(f =>
          fetch(f.download_url)
            .then(r => r.ok ? r.text() : "")
            .then(text => {
              const m = text.match(/^#\s+(.+)$/m);
              return { name: f.name, title: m ? m[1].trim() : fallbackTitle(f.name), date: parseDate(f.name) };
            })
            .catch(() => ({ name: f.name, title: fallbackTitle(f.name), date: parseDate(f.name) }))
        )).then(items => {
          status.remove();
          for (const item of items) {
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = "post.html?f=" + encodeURIComponent(item.name);
            const title = document.createElement("div");
            title.className = "post-title";
            title.textContent = item.title;
            a.appendChild(title);
            if (item.date) {
              const date = document.createElement("div");
              date.className = "post-date";
              date.textContent = item.date;
              a.appendChild(date);
            }
            li.appendChild(a);
            list.appendChild(li);
          }
        });
      })
      .catch(() => {
        status.textContent = "記事一覧を取得できませんでした（GitHubに公開後に表示されます）。";
      });
  })();
  </script>
</body>
</html>
