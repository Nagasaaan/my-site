// ---------- 軽量化: shadowBlur(ガウスぼかし=高コスト)を擬似グローに置換 ----------
// shadowBlur/shadowColorへの代入を横取りし、実際のぼかしは使わずに
// 「発光色の太い半透明ストローク」を2層重ねてにじみを再現する。
(function(){
  const _stroke=ctx.stroke.bind(ctx), _fill=ctx.fill.bind(ctx),
        _fillRect=ctx.fillRect.bind(ctx), _strokeRect=ctx.strokeRect.bind(ctx),
        _fillText=ctx.fillText.bind(ctx), _strokeText=ctx.strokeText.bind(ctx),
        _save=ctx.save.bind(ctx), _restore=ctx.restore.bind(ctx);
  let sb=0, sc='#000';
  const stack=[];
  Object.defineProperty(ctx,'shadowBlur',{get(){return sb;},set(v){sb=+v||0;}});
  Object.defineProperty(ctx,'shadowColor',{get(){return sc;},set(v){sc=v;}});
  ctx.save=function(){stack.push(sb,sc);_save();};
  ctx.restore=function(){sc=stack.pop();sb=stack.pop();_restore();};
  const HALO=[[1,0.14],[0.5,0.22]]; // [ぼかし幅係数, 不透明度]
  function haloStroke(base){
    const lw=ctx.lineWidth, ss=ctx.strokeStyle, ga=ctx.globalAlpha;
    for(const[k,a]of HALO){
      ctx.lineWidth=Math.max(1,base+sb*k); ctx.strokeStyle=sc; ctx.globalAlpha=ga*a;
      _stroke();
    }
    ctx.lineWidth=lw; ctx.strokeStyle=ss; ctx.globalAlpha=ga;
  }
  ctx.stroke=function(p){
    if(p)return _stroke(p);
    if(sb>0.5)haloStroke(ctx.lineWidth);
    _stroke();
  };
  ctx.fill=function(p){
    if(p!==undefined)return _fill(p);
    if(sb>0.5)haloStroke(0);
    _fill();
  };
  ctx.fillRect=function(x,y,w,h){
    if(sb>0.5){
      const lw=ctx.lineWidth, ss=ctx.strokeStyle, ga=ctx.globalAlpha;
      for(const[k,a]of HALO){ctx.lineWidth=Math.max(1,sb*k);ctx.strokeStyle=sc;ctx.globalAlpha=ga*a;_strokeRect(x,y,w,h);}
      ctx.lineWidth=lw;ctx.strokeStyle=ss;ctx.globalAlpha=ga;
    }
    _fillRect(x,y,w,h);
  };
  ctx.strokeRect=function(x,y,w,h){
    if(sb>0.5){
      const lw=ctx.lineWidth, ss=ctx.strokeStyle, ga=ctx.globalAlpha;
      for(const[k,a]of HALO){ctx.lineWidth=lw+sb*k;ctx.strokeStyle=sc;ctx.globalAlpha=ga*a;_strokeRect(x,y,w,h);}
      ctx.lineWidth=lw;ctx.strokeStyle=ss;ctx.globalAlpha=ga;
    }
    _strokeRect(x,y,w,h);
  };
  ctx.fillText=function(t,x,y,mw){
    if(sb>0.5){
      const lw=ctx.lineWidth, ss=ctx.strokeStyle, ga=ctx.globalAlpha, lj=ctx.lineJoin;
      ctx.lineJoin='round';
      for(const[k,a]of HALO){
        ctx.lineWidth=Math.min(10,Math.max(1.5,sb*0.4*k+1));ctx.strokeStyle=sc;ctx.globalAlpha=Math.min(1,ga*a*1.4);
        _strokeText(t,x,y);
      }
      ctx.lineWidth=lw;ctx.strokeStyle=ss;ctx.globalAlpha=ga;ctx.lineJoin=lj;
    }
    mw==null?_fillText(t,x,y):_fillText(t,x,y,mw);
  };
})();

const GRAD_CACHE={};
function cachedGrad(key,sig,make){
  const c=GRAD_CACHE[key];
  if(c&&c.sig===sig)return c.g;
  const g=make();
  GRAD_CACHE[key]={sig,g};
  return g;
}

function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function css(c,a=1){return`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;}
function mixc(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function fmtTime(s){const m=Math.floor(s/60),ss=(s%60);return`${m}:${ss<10?'0':''}${ss.toFixed(1)}`;}

}

let AC=null, master=null;
const bgm={next:0,step:0};
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.42; master.connect(AC.destination);
    bgm.next=AC.currentTime+0.1;
  }catch(e){AC=null;}
}
function tone(f,dur,type='square',v=0.18,when=0,slide=0){
  if(!AC)return;
  const t0=(when||AC.currentTime);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t0+dur);
  g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.02);
}
let NOISE_BUF=null; // ノイズは1秒ぶんを1回だけ生成して使い回す(毎回の生成はGCによるカクつきの原因)
function noiseSE(dur,v=0.25,freq=1200,when=0){
  if(!AC)return;
  const t0=(when||AC.currentTime);
  if(!NOISE_BUF){
    const len=AC.sampleRate|0;
    NOISE_BUF=AC.createBuffer(1,len,AC.sampleRate);
    const d=NOISE_BUF.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  }
  const s=AC.createBufferSource();s.buffer=NOISE_BUF;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+dur);
}

const BASS=[0,0,12,0,3,3,15,3,5,5,17,5,3,3,7,10]; // A minor風
function updateBGM(){
  if(!AC||G.state==='title')return;
  const bpm=100+G.zoneIdx*9+(G.pw.boost>0?18:0);
  const spb=60/bpm/2;
  while(bgm.next<AC.currentTime+0.15){
    const st=bgm.step;
    const f=55*Math.pow(2,BASS[st]/12);
    tone(f,spb*0.9,'sawtooth',0.09,bgm.next);
    if(st%2===1)noiseSE(0.03,0.05,7000,bgm.next);          // ハット
    if(st%8===0)tone(90,0.12,'sine',0.3,bgm.next,-50);      // キック
    if(st%8===4)noiseSE(0.1,0.12,1500,bgm.next);            // スネア
    if(st===0&&Math.random()<0.5)tone(f*4,spb*1.8,'triangle',0.05,bgm.next); // きらめき
    bgm.step=(bgm.step+1)%16;
    bgm.next+=spb;
  }
}

function addScore(n,label,x,y,col){
  if(G.answered||n<=0)return;
  const before=G.score;
  G.score=Math.min(42,G.score+n);
  const got=G.score-before;
  if(label&&got>0)G.texts.push({x:x||W/2,y:y||H-200,txt:`+${got} ${label}`,col:col||'#00e5ff',life:1.2});
  if(G.score===42)trigger42();
}
function trigger42(){

  else type=pick(['shield','boost','magnet','slow','mystery']);
  G.items.push({type,t:0,laneF:ri(-2,2),got:false,rot:0});
}
// ゾーンごとの路肩シーナリー(ドライブの景色が変わる)
const ZONE_SCENERY=[
  ['palm','palm','crys','flower','flower','billboard','lantern','ruin'],       // ネオンネビュラ
  ['rock','rock','arch','vent','rig','crys','rock','billboard'],               // アステロイドベルト
  ['ringpost','arcgate','orb','statue','palm','ringpost','lantern'],           // リングワールド
  ['junk','wreck','scraptower','firebarrel','warnsign','junk','billboard'],    // デブリハイウェイ
  ['obelisk','portal','shard','tether','crys','obelisk','lantern'],            // ワームホールゾーン
];
const CLUSTER=new Set(['crys','rock','flower','junk','shard','lantern']);
const BILLS=['モーテル42 空室あり','中古UFO 3台限り','宇宙ラーメン 24h','ネオン整備工場','燃料+電池+夢','保険『たぶん大丈夫』'];
function spawnProp(){
  if(G.props.length>90)return; // 描画負荷の上限
  const scenery=Math.random()<0.7;
  const type=scenery?pick(ZONE_SCENERY[G.zoneIdx]):pick(['hitch','hitch','jog','music','protest','vendor','pet','robot']);
  const side=Math.random()<0.5?-1:1;
  const far=scenery&&Math.random()<0.4;
  const baseX=side*(far?rnd(520,680):rnd(370,560));
  const mk=(xo)=>{
    const p={type,t:0,xoff:xo,side,seen:false,ph:rnd(0,6),big:Math.random()<0.22};
    if(type==='hitch')p.line=pick(HITCH_SIGNS);
    if(type==='protest')p.line=pick(PROTEST_SIGNS);
    if(type==='vendor')p.line=pick(VENDOR_LINES);
    if(type==='billboard')p.line=pick(BILLS);
    G.props.push(p);
  };
  if(scenery&&CLUSTER.has(type)){
    const n=ri(2,4);
    for(let i=0;i<n;i++)mk(baseX+rnd(-80,80));
  }else mk(baseX);
}
function spawnLampPair(){ // 街灯(左右対・道沿いに連続)
  for(const side of [-1,1])G.props.push({type:'lamp',t:0,xoff:side*(ROAD_EDGE+55),side,seen:true,ph:0});
}
function spawnDriveThru(){

  const side=Math.random()<0.5?-1:1;
  const menu=pick(MENUS);

    :{txt:`前方にドライブスルー(${side<0?'左':'右'}側)! お店に接するレーンへ`,t:3};
}
function spawnBuilding(){
  G.groups.push({kind:'bld',t:0,fired:false,exploded:false,expT:0,name:pick(['ネオン・バーガー(株)本社','銀河複合企業 第3支社','怪しい税務署(自称)','旧・脳内チップ工場'])});
}
function spawnEvent(){

  if(r<0.3){G.superNova={x:rnd(40,W-40),y:rnd(20,VPY-80),t:0};G.caption={txt:'遠くの星がひとつ終わった。宇宙は今日も通常営業。',t:3.5};}
  else if(r<0.55){G.chase={t:0};G.caption={txt:'警察UFOに追われている宇宙人が横切っていった',t:3};}

}

// ---------- 判定・効果 ----------
function playerHit(){
  const p=G.player;
  if(G.bonus||p.inv>0||p.dead)return;
  if(p.shield){
    p.shield=false; p.inv=1.2; G.flash=0.4; G.flashCol='#00e5ff';
    G.texts.push({x:W/2,y:H-220,txt:'シールドが守った!',col:'#00e5ff',life:1.2});
    SE.power(); return;
  }
  p.hp--; p.inv=1.6; G.shake=0.6; G.flash=0.5; G.flashCol='#ff2b4e'; G.zoneNoMiss=false;
  SE.hit();
  if(p.hp<=0){
    p.dead=true; p.deathT=0;
    for(let k=0;k<40;k++){
      const a=rnd(0,6.28),sp=rnd(30,200);
      G.parts.push({x:playerX(),y:playerY(),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(0.5,1.4),col:pick(['#ff2bd6','#00e5ff','#ffffff','#ffd54f']),size:rnd(2,4),grav:120,add:true});
    }
    SE.boom();
  }
}
function collectItem(it){
  it.got=true;
  const px=playerX(),py=playerY()-40;
  switch(it.type){
    case 'crystal':{const v=G.pw.boost>0?2:1;addScore(v,'結晶',px,py);SE.coin();break;}
    case 'rare':addScore(6,'レア結晶!!',px,py,'#ffd54f');SE.rare();spawnFirework();break;
    case 'shield':G.player.shield=true;G.texts.push({x:px,y:py,txt:'シールド',col:'#00e5ff',life:1.2});SE.power();break;
    case 'boost':G.pw.boost=6;G.texts.push({x:px,y:py,txt:'ブースト! 結晶×2',col:'#ff9100',life:1.2});SE.power();break;
    case 'magnet':G.pw.magnet=8;G.texts.push({x:px,y:py,txt:'マグネット',col:'#ff2bd6',life:1.2});SE.power();break;
    case 'slow':G.pw.slow=5;G.texts.push({x:px,y:py,txt:'スローモーション',col:'#7c4dff',life:1.2});SE.power();break;
    case 'mystery':{
      const sub=pick(['shield','boost','magnet','slow','crystals']);
      if(sub==='crystals'){addScore(3,'ミステリー:結晶×3',px,py,'#ffd54f');}
      else{collectItem({type:sub,got:true});G.texts.push({x:px,y:py-24,txt:'ミステリーボックス!',col:'#ffd54f',life:1});}
      SE.rare();break;
    }
  }
  for(let k=0;k<8;k++){const a=rnd(0,6.28);G.parts.push({x:px,y:py+20,vx:Math.cos(a)*60,vy:Math.sin(a)*60,life:0.4,col:'#00e5ff',size:2,grav:0,add:true});}
}
function judgeDriveThru(g){
  g.judged=true;
  if(G.player.lane===g.correct){
    G.combo++;
    addScore(3,`ドライブスルー成功「${g.menu}」`,W/2,H-240,'#00ffb3');
    if(G.combo%3===0)addScore(1,`コンボ×${G.combo}!`,W/2,H-270,'#ffd54f');
    spawnFirework();spawnFirework(); SE.success();
    // 紙吹雪
    for(let k=0;k<30;k++){
      G.parts.push({x:W/2+rnd(-260,260),y:H*0.3+rnd(-50,50),vx:rnd(-70,70),vy:rnd(-50,40),life:rnd(0.7,1.4),col:pick(NEONC),size:rnd(2.5,4.5),grav:170,add:true});
    }
    G.caption={txt:`店員「${g.menu}お待ち!(${MENU_GAG[g.menu]||'当店は無実です'})」`,t:3.5};
  }else{
    G.combo=0; G.glitch=0.6; G.slowPenalty=1.2; SE.fail();
    G.texts.push({x:W/2,y:H-240,txt:'注文ミス…(店員の目が全部こっちを見た)',col:'#ff5252',life:1.6});
  }
}

function playerX(){return proj(PT,G.player.laneF*LANE_W).x;} // レーンと同じ投影(視差カメラ込み)
function playerY(){return VPY+(BOTY-VPY)*ease(PT)-30;}

// ---------- 更新 ----------
let last=performance.now();
function update(dt){
  updateBGM();
  if(G.state==='title'){G.gridOff=(G.gridOff+dt*0.25)%1;G.time+=dt;return;}
  if(G.state==='gameover'){updateParticles(dt);updateFireworks(dt);return;}
  if(G.hitStop>0){G.hitStop-=dt;dt*=0.12;} // 爆発の瞬間のスローモーション

  const p=G.player;
  if(p.dead){
    p.deathT+=dt;updateParticles(dt);
    G.shake=Math.max(0,G.shake-dt);
    if(p.deathT>1.4){
      G.state='gameover';
      if(G.score>best.score){best.score=G.score;saveLS('rgd_best_score',best.score);G.newRec.score=true;}
      if(G.dist>best.dist){best.dist=G.dist;saveLS('rgd_best_dist',best.dist);}
    }
    return;
  }

  G.time+=dt;
  // スピード(徐々に上昇/ペナルティ減速)
  const base=0.42+Math.min(G.dist/9000,0.5)+G.zoneIdx*0.035;
  const pen=G.slowPenalty>0?0.55:1;
  G.speed=lerp(G.speed,base*pen,dt*3);
  G.slowPenalty=Math.max(0,G.slowPenalty-dt);
  G.dist+=G.speed*130*dt;
  G.gridOff=(G.gridOff+G.speed*dt*1.4)%1;

  // ゾーン遷移
  let zi=0;for(let i=0;i<ZONES.length;i++)if(G.dist>=ZONES[i].d)zi=i;
  if(zi!==G.zoneIdx){
    const prev=ZONES[G.zoneIdx].name;
    G.zoneIdx=zi;
    G.zoneFx=2.6;G.zoneFxName=prev;G.zoneFxBonus=false;
    if(G.zoneNoMiss){addScore(2,'ノーミスゾーンクリア!');G.zoneFxBonus=true;}
    G.zoneNoMiss=true;
    G.flash=0.5;G.flashCol='#ffffff';
    spawnFirework(1.6);spawnFirework(1.6);spawnFirework(2);spawnFirework(2);SE.zone();
  }
  const zc=ZONES[G.zoneIdx];
  for(const k of ['top','bot','grid','sun1','sun2','acc'])G.col[k]=mixc(G.col[k],h2r(zc[k]),Math.min(1,dt*1.5));
  G.zoneFx=Math.max(0,G.zoneFx-dt);

  // タイマー減衰
  p.inv=Math.max(0,p.inv-dt);
  G.pw.boost=Math.max(0,G.pw.boost-dt);
  G.pw.magnet=Math.max(0,G.pw.magnet-dt);
  G.pw.slow=Math.max(0,G.pw.slow-dt);
  G.shake=Math.max(0,G.shake-dt*1.5);
  G.flash=Math.max(0,G.flash-dt*2);
  G.glitch=Math.max(0,G.glitch-dt);
  G.fx42=Math.max(0,G.fx42-dt);
  if(G.caption){G.caption.t-=dt;if(G.caption.t<=0)G.caption=null;}
  G.adX-=dt*80;if(G.adX<-3200)G.adX=W;

  // レーン移動(表示&判定用の補間)
  p.laneF=lerp(p.laneF,p.lane,Math.min(1,dt*12));
  // エンジントレイル(常時キラキラ)
  if(!p.dead){
    G.parts.push({x:playerX()+rnd(-16,16),y:playerY()+16,vx:rnd(-10,10),vy:rnd(50,110),life:rnd(0.25,0.45),col:G.bonus?'#ffd54f':(G.pw.boost>0?'#ff9100':pick(['#00e5ff','#ff2bd6'])),size:rnd(1.5,3.2),grav:0,add:true});
  }

  // ---- スポーン ----
  const groupActive=G.groups.some(g=>g.t<1.05);
  G.obsTimer-=dt;
  if(G.obsTimer<=0&&!groupActive&&!G.bonus){
    spawnObstacle();
    G.obsTimer=rnd(0.9,1.6)*Math.max(0.45,1-G.zoneIdx*0.12)/(0.6+G.speed);
  }
  G.itemTimer-=dt;
  if(G.itemTimer<=0){spawnItem();G.itemTimer=rnd(2.5,4.5);}
  if(G.crystalRun){
    G.crystalRun.timer-=dt;
    if(G.crystalRun.timer<=0){
      G.items.push({type:'crystal',t:0,laneF:G.crystalRun.lane,got:false,rot:0});
      G.crystalRun.n--;G.crystalRun.timer=0.35/(0.6+G.speed);
      if(G.crystalRun.n<=0)G.crystalRun=null;
    }
  }
  G.puTimer-=dt;
  if(G.puTimer<=0){spawnPowerup();G.puTimer=rnd(10,16);}
  G.propTimer-=dt;
  if(G.propTimer<=0){spawnProp();G.propTimer=rnd(0.18,0.45);}
  if(G.dist>G.nextLamp){spawnLampPair();G.nextLamp=G.dist+130;}
  G.evtTimer-=dt;
  if(G.evtTimer<=0){spawnEvent();G.evtTimer=rnd(9,16);}
  if(!G.bonus){
    if(G.dist>G.nextDT&&!groupActive){spawnDriveThru();G.nextDT=G.dist+rnd(550,750);}
    if(G.dist>G.nextBld&&G.zoneIdx>=1&&!groupActive){if(Math.random()<0.6)spawnBuilding();G.nextBld=G.dist+rnd(900,1400);}
  }
  if(G.bonus){if(Math.random()<dt*0.8)spawnFirework(1.5);}

  // ---- 障害物更新 ----
  const slowMul=G.pw.slow>0?0.45:1;
  for(let i=G.obs.length-1;i>=0;i--){
    const o=G.obs[i];
    o.t+=G.speed*(0.15+o.t)*dt*(o.mul||1)*slowMul;
    if(o.rot!=null)o.rot+=(o.spin||0)*dt;
    if(o.type==='ufo'){
      o.retime-=dt;
      if(o.retime<=0){o.target=clamp(Math.round(o.laneF)+ri(-1,1),-2,2);o.retime=rnd(0.8,1.5);}
      o.laneF=lerp(o.laneF,o.target,dt*1.8);
    }
    // 衝突
    if(!o.hit&&o.t>0.84&&o.t<0.96&&!G.bonus){
      let hit=false;
      if(o.type==='laser'){
        const on=((G.time*0.8+o.phase)%1)<0.5;
        if(on)hit=true;
      }else{
        if(Math.abs(o.laneF-p.laneF)<0.5)hit=true;
      }
      if(hit){o.hit=true;playerHit();}
    }
    if(o.t>1.1)G.obs.splice(i,1);
  }

  // ---- アイテム更新 ----
  for(let i=G.items.length-1;i>=0;i--){
    const it=G.items[i];
    it.t+=G.speed*(0.15+it.t)*dt;
    it.rot+=dt*3;
    if(G.pw.magnet>0&&it.type==='crystal'&&it.t>0.55)it.laneF=lerp(it.laneF,p.laneF,dt*6);
    if(!it.got&&it.t>0.8&&it.t<0.98&&Math.abs(it.laneF-p.laneF)<0.55)collectItem(it);
    if(it.t>1.05||it.got)G.items.splice(i,1);
  }

  // ---- 路肩プロップ ----
  for(let i=G.props.length-1;i>=0;i--){
    const pr=G.props[i];
    pr.t+=G.speed*(0.15+pr.t)*dt;
    pr.ph+=dt*3;
    if(!pr.seen&&pr.t>0.8){
      pr.seen=true;
      if(pr.type==='hitch')G.caption={txt:`ヒッチハイク宇宙人『${pr.line}』`,t:3};
      else if(pr.type==='protest')G.caption={txt:`デモ隊『${pr.line}』`,t:3};
      else if(pr.type==='vendor')G.caption={txt:`露天商「${pr.line}」`,t:3};
      else if(pr.type==='bdance')G.caption={txt:pr.line,t:3};
      else if(pr.type==='music'){SE.theremin();}
    }
    if(pr.t>1.15)G.props.splice(i,1);
  }

  // ---- ドライブスルー/建造物 ----
  for(let i=G.groups.length-1;i>=0;i--){
    const g=G.groups[i];
    g.t+=G.speed*(0.15+g.t)*dt*0.9;
    if(g.kind==='dt'&&!g.judged&&g.t>0.86)judgeDriveThru(g);
    if(g.kind==='bld'){
      if(!g.fired&&g.t>0.42){
        g.fired=true;
        // 3連ロケット(左右はわずかに遅れて発射)
        for(const xo of [-1,0,1])G.rockets.push({t:PT-0.03,xoff:xo*LANE_W*0.9,target:g,delay:Math.abs(xo)*0.13});
        SE.rocket();
        G.caption={txt:'障害物ビル検知 → ロケット3連発射(交渉は決裂しました)',t:3};
      }
      if(g.exploded)g.expT+=dt;
      if(!g.exploded&&g.t>0.8){explodeBuilding(g);} // 保険:必ず爆破
    }
    if(g.t>1.1||(g.kind==='bld'&&g.exploded&&g.expT>1.5))G.groups.splice(i,1);
  }

  // ---- ロケット ----
  for(let i=G.rockets.length-1;i>=0;i--){
    const r=G.rockets[i];
    if(r.delay>0){r.delay-=dt;continue;}
    r.t-=dt*0.6;
    r.xoff=lerp(r.xoff||0,0,dt*2.5); // 中央へ収束
    const pos=proj(r.t,r.xoff||0);
    // 炎と煙の尾
    for(let k=0;k<2;k++){
      G.parts.push({x:pos.x+rnd(-4,4),y:pos.y-14*pos.s,vx:rnd(-14,14),vy:rnd(40,110),life:rnd(0.25,0.5),col:pick(['#ff9100','#ffd54f','#ffffff']),size:rnd(2,4.5),grav:0,add:true});
    }
    if(Math.random()<0.6)G.parts.push({x:pos.x+rnd(-5,5),y:pos.y-8*pos.s,vx:rnd(-8,8),vy:rnd(15,40),life:rnd(0.5,0.9),col:'#667',size:rnd(3,6),grav:-15,add:false});
    if(r.target&&r.t<=r.target.t+0.02){
      if(!r.target.exploded)explodeBuilding(r.target);
      else secondaryBoom(pos.x+rnd(-40,40),pos.y-rnd(10,60)*pos.s,pos.s);
      G.rockets.splice(i,1);
    }else if(r.t<0){G.rockets.splice(i,1);}
  }
  // ---- 二次爆発タイマー ----
  for(let i=G.timers.length-1;i>=0;i--){
    const tm=G.timers[i];
    tm.t-=dt;
    if(tm.t<=0){G.timers.splice(i,1);secondaryBoom(tm.x,tm.y,tm.sc);}
  }
  // ---- 衝撃波リング ----
  for(let i=G.rings.length-1;i>=0;i--){
    const rg2=G.rings[i];
    rg2.r+=rg2.vr*dt;
    rg2.vr*=Math.pow(0.35,dt);
    rg2.life-=dt;
    if(rg2.life<=0)G.rings.splice(i,1);
  }

  // ---- 追跡イベント ----
  if(G.chase){
    G.chase.t+=dt*0.7;
    if(G.chase.t>1.4)G.chase=null;
  }
  if(G.superNova){G.superNova.t+=dt;if(G.superNova.t>3)G.superNova=null;}
  if(G.holo){G.holo.t+=dt;if(G.holo.t>2.5)G.holo=null;}

  updateParticles(dt);
  updateFireworks(dt);
  for(let i=G.texts.length-1;i>=0;i--){const t=G.texts[i];t.life-=dt;t.y-=dt*40;if(t.life<=0)G.texts.splice(i,1);}
}
function explodeBuilding(g){
  g.exploded=true;g.expT=0;
  const pos=proj(g.t,0);
  const cx2=pos.x,cy2=pos.y-50*pos.s;
  G.shake=1.6;G.flash=1;G.flashCol='#ffd9a0';G.hitStop=0.13; // ヒットストップで衝撃を演出
  SE.boom();
  // 衝撃波リング(3重)
  for(let i=0;i<3;i++)G.rings.push({x:cx2,y:cy2,r:12+i*24,vr:560-i*130,life:0.75+i*0.15,col:i===0?'#ffffff':(i===1?'#ffd54f':'#ff9100'),lw:8-i*2});
  // 巨大火球(上昇しながら膨らむ)
  for(let k=0;k<16;k++){
    const a=rnd(0,6.28),sp=rnd(15,100)*pos.s;
    G.parts.push({x:cx2+rnd(-110,110)*pos.s,y:cy2-rnd(-20,90)*pos.s,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-50*pos.s,life:rnd(0.5,1),col:pick(['#ffd54f','#ff9100','#ff5222','#ffffff']),size:rnd(16,34)*pos.s,grav:-40,add:true,fire:true});
  }
  // 瓦礫(大量・重力で降り注ぐ)
  for(let k=0;k<80;k++){
    const a=rnd(0,6.28),sp=rnd(60,460)*pos.s;
    G.parts.push({x:cx2+rnd(-100,100)*pos.s,y:cy2-rnd(0,100)*pos.s,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-90*pos.s,life:rnd(0.5,1.6),col:pick(['#ff9100','#ffd54f','#ff2b4e','#8899aa','#ffffff','#c8a2ff']),size:rnd(2,6)*pos.s,grav:340,add:true});
  }
  // 白熱スパーク(高速で細長い)
  for(let k=0;k<30;k++){
    const a=rnd(0,6.28),sp=rnd(300,700)*pos.s;
    G.parts.push({x:cx2,y:cy2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*0.6,life:rnd(0.2,0.45),col:pick(['#ffffff','#ffd54f']),size:rnd(1.5,3),grav:0,add:true});
  }
  // 二次爆発(時間差でドカン×3)
  for(let i=1;i<=3;i++)G.timers.push({t:0.16*i+rnd(0,0.08),x:cx2+rnd(-140,140)*pos.s,y:cy2-rnd(-20,110)*pos.s,sc:pos.s*(1.05-i*0.18)});
  G.caption={txt:`「${g.name}」は瓦礫になった。株価は逆に上がった。`,t:3.5};
}
function secondaryBoom(x,y,sc){
  G.shake=Math.max(G.shake,0.6);G.flash=Math.max(G.flash,0.4);G.flashCol='#ffd9a0';
  G.rings.push({x,y,r:8,vr:420,life:0.5,col:'#ffd54f',lw:5});
  for(let k=0;k<7;k++){
    const a=rnd(0,6.28);
    G.parts.push({x:x+rnd(-30,30),y:y+rnd(-20,20),vx:Math.cos(a)*rnd(10,60),vy:rnd(-70,-20),life:rnd(0.4,0.8),col:pick(['#ffd54f','#ff9100','#ff5222']),size:rnd(10,22)*Math.max(0.4,sc),grav:-30,add:true,fire:true});
  }
  for(let k=0;k<24;k++){
    const a=rnd(0,6.28),sp=rnd(80,360);
    G.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*0.7,life:rnd(0.3,0.9),col:pick(['#ff9100','#ffd54f','#ffffff','#8899aa']),size:rnd(2,5),grav:300,add:true});
  }
  SE.boom();
}
const MAX_PARTS=300; // 爆発や花火が重なった時の負荷スパイクを防ぐ
function updateParticles(dt){
  if(G.parts.length>MAX_PARTS)G.parts.splice(0,G.parts.length-MAX_PARTS);
  for(let i=G.parts.length-1;i>=0;i--){
    const q=G.parts[i];
    q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.grav||0)*dt;
    if(q.life<=0)G.parts.splice(i,1);
  }
}

// ---------- 描画 ----------
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>0)ctx.translate(rnd(-1,1)*G.shake*10,rnd(-1,1)*G.shake*10);

  drawSky();
  drawFireworksLayer();
  drawSun();
  drawSkyline();
  drawAdTicker();
  drawGrid();
  drawWorld();
  drawHaze();
  if(!G.player.dead||G.player.deathT<0.2)drawPlayer();
  drawParticles();
  drawRings();
  drawSpeedStreaks();

  ctx.restore();

  drawHUD();
  drawOverlays();
  drawScanlines();
  if(G.glitch>0)drawGlitch();
}

function drawSky(){
  const cTop=css(G.col.top),cBot=css(G.col.bot);
  const g=cachedGrad('sky',cTop+cBot,()=>{
    const g=ctx.createLinearGradient(0,0,0,VPY+80);
    g.addColorStop(0,cTop);g.addColorStop(1,cBot);
    return g;
  });
  ctx.fillStyle=g;ctx.fillRect(0,0,W,VPY+2);
  // 地面側もグラデ
  const cGround=css(mixc(G.col.bot,[0,0,0],0.5));
  const g2=cachedGrad('ground',cGround,()=>{
    const g2=ctx.createLinearGradient(0,VPY,0,H);
    g2.addColorStop(0,cGround);g2.addColorStop(1,'#05010f');
    return g2;
  });
  ctx.fillStyle=g2;ctx.fillRect(0,VPY,W,H-VPY);
  // 星
  for(const s of STARS){
    const tw=0.5+0.5*Math.sin(G.time*2+s.p);
    ctx.fillStyle=`rgba(255,255,255,${0.25+0.5*tw})`;
    ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  // たまに流れ星(全ゾーン・光る尾つき)
  {
    const cyc=6.5, k=Math.floor(G.time/cyc), ph2=(G.time%cyc)/1.1;
    if(ph2<1){
      const sx0=rndSeeded(k*3.7)*W, sy0=15+rndSeeded(k*7.1)*110;
      const dx=0.9,dy=0.36;
      const hx=sx0+ph2*300*dx, hy=sy0+ph2*300*dy;
      if(hy<VPY-10){
        ctx.save();ctx.globalCompositeOperation='lighter';
        const fade=Math.sin(ph2*Math.PI);
        const grd4=ctx.createLinearGradient(hx,hy,hx-95*dx,hy-95*dy);
        grd4.addColorStop(0,`rgba(220,240,255,${0.95*fade})`);
        grd4.addColorStop(1,'rgba(120,180,255,0)');
        ctx.strokeStyle=grd4;ctx.lineWidth=2.2;
        ctx.shadowColor='#aaddff';ctx.shadowBlur=8*fade;
        ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx-95*dx,hy-95*dy);ctx.stroke();
        ctx.fillStyle=`rgba(255,255,255,${0.9*fade})`;
        ctx.beginPath();ctx.arc(hx,hy,1.8,0,6.28);ctx.fill();
        ctx.restore();
      }
    }
  }
  // 超新星
  if(G.superNova){
    const sn=G.superNova,a=sn.t<0.5?sn.t*2:Math.max(0,1-(sn.t-0.5)/2.5);
    ctx.save();ctx.globalCompositeOperation='lighter';
    const r=8+sn.t*30;
    const gr=ctx.createRadialGradient(sn.x,sn.y,0,sn.x,sn.y,r);
    gr.addColorStop(0,`rgba(255,255,255,${a})`);gr.addColorStop(0.4,`rgba(255,180,120,${a*0.7})`);gr.addColorStop(1,'rgba(255,100,50,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(sn.x,sn.y,r,0,6.28);ctx.fill();
    ctx.restore();
  }
  // ワームホールゾーンの渦
  if(G.zoneIdx===4){
    ctx.save();ctx.globalAlpha=0.35;ctx.strokeStyle=css(G.col.acc);ctx.lineWidth=1.5;
    for(let i=0;i<5;i++){
      ctx.beginPath();
      ctx.arc(W/2,VPY-30,26+i*36,G.time*0.7+i,G.time*0.7+i+4.2);
      ctx.stroke();
    }
    ctx.restore();
  }
  // 右上の環つき惑星: 周期的に隕石が直撃して爆発する(全ゾーン共通の背景コント)
  {
    const px4=W*0.82,py4=90;
    const C=16, cyc=Math.floor(G.time/C), ph3=G.time%C, impact=9.0;
    if(ph3<impact){
      // 惑星(新品がフェードインして補充される)
      const ap=Math.min(1,ph3/0.8);
      ctx.save();ctx.globalAlpha=ap;
      const pg=ctx.createRadialGradient(px4-14,py4-14,4,px4,py4,44);
      pg.addColorStop(0,'rgba(255,150,220,0.8)');pg.addColorStop(1,'rgba(90,20,120,0.55)');
      ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px4,py4,44,0,6.28);ctx.fill();
      ctx.strokeStyle='rgba(0,229,255,0.5)';ctx.lineWidth=3;
      ctx.beginPath();ctx.ellipse(px4,py4,66,14,-0.3,0,6.28);ctx.stroke();
      const ma=G.time*0.3;
      ctx.fillStyle='rgba(200,220,255,0.8)';
      ctx.beginPath();ctx.arc(px4+Math.cos(ma)*80,py4+Math.sin(ma)*20,6,0,6.28);ctx.fill();
      ctx.restore();
      // 衝突コースの隕石(直撃2.2秒前から・画面内を横切って向かう)
      const inT=(ph3-(impact-2.2))/2.2;
      if(inT>0){
        const sx2=px4-520*(1-inT),sy2=py4-90*(1-inT);
        ctx.save();ctx.globalCompositeOperation='lighter';
        const g5=ctx.createLinearGradient(sx2,sy2,sx2-100,sy2-17);
        g5.addColorStop(0,'rgba(255,240,200,1)');g5.addColorStop(0.4,'rgba(255,150,60,0.6)');g5.addColorStop(1,'rgba(255,80,20,0)');
        ctx.strokeStyle=g5;ctx.lineWidth=3.5;
        ctx.shadowColor='#ff9100';ctx.shadowBlur=14;
        ctx.beginPath();ctx.moveTo(sx2,sy2);ctx.lineTo(sx2-100,sy2-17);ctx.stroke();
        ctx.shadowBlur=0;
        ctx.fillStyle='rgba(255,255,255,0.95)';
        ctx.beginPath();ctx.arc(sx2,sy2,4.5,0,6.28);ctx.fill();
        ctx.restore();
      }
    }else{
      const bt=ph3-impact;
      if(G.pBoomCyc!==cyc){ // 直撃の瞬間: 破片を撒いて一言
        G.pBoomCyc=cyc;
        if(G.state==='playing'){ // パーティクル更新はプレイ中のみ動くため
          for(let k=0;k<36;k++){
            const a=rnd(0,6.28),sp2=rnd(30,160);
            G.parts.push({x:px4,y:py4,vx:Math.cos(a)*sp2,vy:Math.sin(a)*sp2*0.7,life:rnd(0.6,1.8),col:pick(['#ff80ff','#ffd54f','#ff9100','#ffffff','#c8a2ff']),size:rnd(1.5,3.5),grav:14,add:true});
          }
          if(!G.caption)G.caption={txt:'右上の惑星に隕石が直撃。惑星保険は未加入だった模様。',t:4};
        }
      }
      if(bt<1.1){ // 閃光+衝撃波リング
        ctx.save();ctx.globalCompositeOperation='lighter';
        const fa=Math.max(0,1-bt/1.1);
        const fg=ctx.createRadialGradient(px4,py4,0,px4,py4,60+bt*100);
        fg.addColorStop(0,`rgba(255,255,255,${0.9*fa})`);
        fg.addColorStop(0.4,`rgba(255,160,220,${0.5*fa})`);
        fg.addColorStop(1,'rgba(255,80,180,0)');
        ctx.fillStyle=fg;ctx.beginPath();ctx.arc(px4,py4,60+bt*100,0,6.28);ctx.fill();
        ctx.strokeStyle=`rgba(255,220,255,${0.85*fa})`;ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(px4,py4,20+bt*140,0,6.28);ctx.stroke();
        ctx.restore();
      }
      // 残骸: 割れて漂う輪と燃えるかけら
      const ga=Math.max(0,1-bt/(C-impact));
      ctx.save();ctx.globalAlpha=ga*0.8;
      ctx.strokeStyle='rgba(0,229,255,0.45)';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.ellipse(px4,py4+bt*6,66,14,-0.3+bt*0.06,0.4,2.4);ctx.stroke();
      ctx.beginPath();ctx.ellipse(px4,py4+bt*9,66,14,-0.3-bt*0.05,3.6,5.6);ctx.stroke();
      ctx.fillStyle='rgba(255,150,80,0.85)';
      for(let k=0;k<5;k++){
        const aa=k*1.3+bt*0.4,rr3=26+k*9+bt*12;
        ctx.beginPath();ctx.arc(px4+Math.cos(aa)*rr3,py4+Math.sin(aa)*rr3*0.6,2.2,0,6.28);ctx.fill();
      }
      ctx.restore();
    }
  }
  // アステロイドベルト: 光る軌跡を引いて流れる隕石
  if(G.zoneIdx===1){
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let i=0;i<6;i++){
      const sp=90+(i*37)%80;
      const dx=0.94,dy=0.34+((i*17)%10)*0.02;
      const path=W+500;
      const pr2=((G.time*sp)+i*713)%path-250;
      const hx=pr2*dx+(i*89)%200;
      const hy=18+(i*61)%110+pr2*dy*0.35;
      if(hy>VPY-12||hx<-120)continue;
      const tl=80+(i*23)%60;
      // 発光する軌跡
      const grd3=ctx.createLinearGradient(hx,hy,hx-tl*dx,hy-tl*dy*0.35);
      grd3.addColorStop(0,'rgba(255,240,200,0.95)');
      grd3.addColorStop(0.35,'rgba(255,150,60,0.55)');
      grd3.addColorStop(1,'rgba(255,80,20,0)');
      ctx.strokeStyle=grd3;ctx.lineWidth=3;
      ctx.shadowColor='#ff9100';ctx.shadowBlur=12;
      ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx-tl*dx,hy-tl*dy*0.35);ctx.stroke();
      ctx.shadowBlur=0;
      // 頭部の輝き+岩本体
      const hg=ctx.createRadialGradient(hx,hy,0,hx,hy,9);
      hg.addColorStop(0,'rgba(255,255,255,0.95)');hg.addColorStop(1,'rgba(255,140,40,0)');
      ctx.fillStyle=hg;ctx.beginPath();ctx.arc(hx,hy,9,0,6.28);ctx.fill();
      ctx.fillStyle='rgba(120,60,25,0.9)';
      ctx.beginPath();ctx.arc(hx,hy,3.2,0,6.28);ctx.fill();
    }
    ctx.restore();
    // 漂う岩のシルエット(奥行き用)
    ctx.save();ctx.fillStyle='rgba(60,25,12,0.85)';ctx.strokeStyle='rgba(255,145,0,0.5)';ctx.lineWidth=1.5;
    for(let i=0;i<4;i++){
      const ax=(i*271+((G.time*6*(1+i%2))%300))%(W+80)-40;
      const ay=45+(i*77)%140, ar=7+(i*13)%12;
      ctx.beginPath();
      for(let k=0;k<6;k++){const an=k/6*6.28;const rr2=ar*(0.7+0.3*rndSeeded(i*7+k));
        k?ctx.lineTo(ax+Math.cos(an)*rr2,ay+Math.sin(an)*rr2*0.8):ctx.moveTo(ax+Math.cos(an)*rr2,ay+Math.sin(an)*rr2*0.8);}
      ctx.closePath();ctx.fill();ctx.stroke();
    }
    ctx.restore();
  }
  // デブリハイウェイ: 廃棄ステーションのシルエットとクレーン
  if(G.zoneIdx===3){
    ctx.save();ctx.strokeStyle='rgba(0,255,179,0.35)';ctx.fillStyle='rgba(5,15,10,0.9)';ctx.lineWidth=2;
    for(const[cx2,sc]of[[W*0.14,1],[W*0.86,0.8]]){
      ctx.beginPath();ctx.moveTo(cx2,VPY);ctx.lineTo(cx2,VPY-90*sc);ctx.lineTo(cx2+70*sc,VPY-70*sc);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx2+70*sc,VPY-70*sc);ctx.lineTo(cx2+70*sc,VPY-40*sc);ctx.stroke();
      ctx.fillRect(cx2+58*sc,VPY-40*sc,24*sc,16*sc);ctx.strokeRect(cx2+58*sc,VPY-40*sc,24*sc,16*sc);
      if((G.time*2|0)%2){ctx.fillStyle='#ff2b4e';ctx.fillRect(cx2-2,VPY-94*sc,4,4);ctx.fillStyle='rgba(5,15,10,0.9)';}
    }
    ctx.restore();
  }
  // リングワールドの輪
  if(G.zoneIdx===2){
    ctx.save();ctx.globalAlpha=0.5;ctx.strokeStyle=css(G.col.acc);ctx.lineWidth=6;
    ctx.beginPath();ctx.ellipse(W/2,VPY-40,360,64,-0.18,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
    ctx.restore();
  }
}
function drawSun(){
  const cx=W/2,cy=VPY-6,R=118;
  ctx.save();
  const c1=css(G.col.sun1),c2=css(G.col.sun2);
  const g=cachedGrad('sun',c1+c2,()=>{
    const g=ctx.createLinearGradient(0,cy-R,0,cy+R);
    g.addColorStop(0,c1);g.addColorStop(1,c2);
    return g;
  });
  ctx.shadowColor=css(G.col.sun2);ctx.shadowBlur=50;
  ctx.beginPath();ctx.arc(cx,cy,R,Math.PI,0);ctx.closePath();
  ctx.fillStyle=g;ctx.fill();
  ctx.shadowBlur=0;
  // 上半分も薄く
  ctx.globalAlpha=0.9;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  ctx.globalAlpha=1;
  // シンセウェイブ・スリット
  ctx.globalCompositeOperation='destination-out';
  for(let j=0;j<9;j++){
    const yy=cy-6+j*15+((G.time*10)%15);
    ctx.fillRect(cx-R-4,yy,R*2+8,2+j*1.2);
  }
  ctx.globalCompositeOperation='source-over';
  // 地平線グロー
  ctx.fillStyle=css(G.col.grid,0.5);
  ctx.shadowColor=css(G.col.grid);ctx.shadowBlur=14;
  ctx.fillRect(0,VPY,W,2);
  ctx.restore();
}
function drawFerrisWheel(cx2,r){
  const cy2=VPY-r-8;
  ctx.save();
  // 支柱
  ctx.strokeStyle='rgba(130,110,170,0.85)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(cx2-r*0.55,VPY);ctx.lineTo(cx2,cy2);ctx.lineTo(cx2+r*0.55,VPY);ctx.stroke();
  // リム(ネオン)
  ctx.strokeStyle='rgba(255,43,214,0.8)';ctx.lineWidth=2.5;
  ctx.shadowColor='#ff2bd6';ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(cx2,cy2,r,0,6.28);ctx.stroke();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,43,214,0.35)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(cx2,cy2,r*0.55,0,6.28);ctx.stroke();
  // スポークとゴンドラ(ゆっくり回転)
  const rot=G.time*0.18;
  for(let i=0;i<8;i++){
    const a=rot+i*Math.PI/4;
    const gx=cx2+Math.cos(a)*r,gy=cy2+Math.sin(a)*r;
    ctx.strokeStyle='rgba(255,43,214,0.4)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx2,cy2);ctx.lineTo(gx,gy);ctx.stroke();
    ctx.fillStyle=NEONC[i%NEONC.length];
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=5;
    ctx.fillRect(gx-2,gy,4,5.5);
    ctx.shadowBlur=0;
  }
  ctx.restore();
}
function drawSkyline(){
  ctx.save();
  // ---- 奥列: 淡いシルエット+うっすら窓 ----
  for(const b of SKY_BLD){
    if(b.layer!==0)continue;
    ctx.fillStyle='rgba(14,7,34,0.72)';
    ctx.fillRect(b.x,VPY-b.h,b.w,b.h);
    ctx.fillStyle=css(G.col.acc,0.16);
    for(let wy=VPY-b.h+5;wy<VPY-4;wy+=10)for(let wx=b.x+3;wx<b.x+b.w-4;wx+=9)
      if(((wx*7+wy*13)%23)<5)ctx.fillRect(wx,wy,2,3);
  }
  // ---- ランドマーク観覧車 ----
  drawFerrisWheel(W*0.13,46);
  // ---- 手前列: ベガス風の個性ビル ----
  for(const b of SKY_BLD){
    if(b.layer!==1)continue;
    if(b.style===6){
      // ピラミッド型カジノ+頂上ビーム
      ctx.fillStyle='rgba(5,2,18,0.96)';
      ctx.beginPath();ctx.moveTo(b.x-4,VPY);ctx.lineTo(b.x+b.w/2,VPY-b.h);ctx.lineTo(b.x+b.w+4,VPY);ctx.closePath();ctx.fill();
      ctx.strokeStyle=b.col;ctx.globalAlpha=0.7;ctx.lineWidth=1.5;ctx.stroke();ctx.globalAlpha=1;
      ctx.save();ctx.globalCompositeOperation='lighter';
      const bg2=ctx.createLinearGradient(0,VPY-b.h,0,VPY-b.h-130);
      bg2.addColorStop(0,'rgba(255,240,180,0.45)');bg2.addColorStop(1,'rgba(255,240,180,0)');
      ctx.fillStyle=bg2;ctx.fillRect(b.x+b.w/2-2,VPY-b.h-130,4,130);
      ctx.restore();
      continue;
    }
    ctx.fillStyle='rgba(5,2,18,0.96)';
    ctx.fillRect(b.x,VPY-b.h,b.w,b.h);
    // 窓明かり(暖色と差し色を混ぜ、たまにチカッと点滅)
    for(let wy=VPY-b.h+4;wy<VPY-3;wy+=7)for(let wx=b.x+3;wx<b.x+b.w-4;wx+=7){
      const idn=(wx*13+wy*7)%29;
      if(idn<8){
        const flick=idn===3&&(((G.time*2+wx*0.7)|0)%5===0);
        ctx.fillStyle=flick?'rgba(255,255,255,0.95)':(idn<3?'rgba(255,200,120,0.6)':css(G.col.acc,0.5));
        ctx.fillRect(wx,wy,2.5,3.5);
      }
    }
    if(b.style===1){ // アンテナ+赤ビーコン
      ctx.strokeStyle='rgba(120,130,170,0.8)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(b.x+b.w/2,VPY-b.h);ctx.lineTo(b.x+b.w/2,VPY-b.h-16);ctx.stroke();
      if(((G.time*1.5+b.seed)|0)%2){
        ctx.fillStyle='#ff2b4e';ctx.shadowColor='#ff2b4e';ctx.shadowBlur=9;
        ctx.fillRect(b.x+b.w/2-1.5,VPY-b.h-19,3,3);ctx.shadowBlur=0;
      }
    }else if(b.style===2){ // 屋上ネオンバー(脈動)
      const pu=0.6+0.4*Math.sin(G.time*2+b.seed);
      ctx.strokeStyle=b.col;ctx.globalAlpha=pu;ctx.lineWidth=1.5;
      ctx.shadowColor=b.col;ctx.shadowBlur=8*pu;
      ctx.strokeRect(b.x+b.w*0.15,VPY-b.h-9,b.w*0.7,7);
      ctx.fillStyle=b.col;ctx.globalAlpha=0.3*pu;
      ctx.fillRect(b.x+b.w*0.15,VPY-b.h-9,b.w*0.7,7);
      ctx.globalAlpha=1;ctx.shadowBlur=0;
    }else if(b.style===3){ // ドーム屋根
      ctx.fillStyle='rgba(5,2,18,0.96)';
      ctx.beginPath();ctx.arc(b.x+b.w/2,VPY-b.h,b.w/2,Math.PI,0);ctx.fill();
      ctx.strokeStyle=b.col;ctx.globalAlpha=0.5;ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(b.x+b.w/2,VPY-b.h,b.w/2,Math.PI,0);ctx.stroke();ctx.globalAlpha=1;
    }else if(b.style===4&&b.text){ // 縦型ネオンサイン(マーキー点滅)
      const ch=[...b.text];
      const sh=ch.length*10+8;
      if(b.h>sh+14){
        const sy=VPY-b.h+5,sx2=b.x-10;
        ctx.fillStyle='rgba(10,5,20,0.92)';ctx.strokeStyle=b.col;ctx.lineWidth=1.2;
        ctx.shadowColor=b.col;ctx.shadowBlur=6+3*Math.sin(G.time*3+b.seed);
        ctx.fillRect(sx2,sy,14,sh);ctx.strokeRect(sx2,sy,14,sh);
        ctx.shadowBlur=0;
        ctx.fillStyle=b.col;ctx.font='900 9px "Hiragino Kaku Gothic ProN",sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        for(let i=0;i<ch.length;i++){
          ctx.globalAlpha=(((G.time*5+b.seed)|0)%(ch.length+2))===i?0.2:1; // 1文字ずつ消えるマーキー
          ctx.fillText(ch[i],sx2+7,sy+9+i*10);
        }
        ctx.globalAlpha=1;
      }
    }else if(b.style===5&&b.text){ // 屋上ビルボード広告
      const bw2=Math.max(b.w*1.25,b.text.length*8+10);
      const bx2=b.x+b.w/2-bw2/2,byy=VPY-b.h-17;
      ctx.strokeStyle='rgba(120,130,170,0.8)';ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(b.x+b.w*0.25,VPY-b.h);ctx.lineTo(b.x+b.w*0.25,byy+13);
      ctx.moveTo(b.x+b.w*0.75,VPY-b.h);ctx.lineTo(b.x+b.w*0.75,byy+13);
      ctx.stroke();
      const pu=0.7+0.3*Math.sin(G.time*1.6+b.seed);
      ctx.fillStyle='rgba(10,5,20,0.92)';ctx.strokeStyle=b.col;ctx.lineWidth=1.3;
      ctx.shadowColor=b.col;ctx.shadowBlur=8*pu;
      ctx.fillRect(bx2,byy,bw2,13);ctx.strokeRect(bx2,byy,bw2,13);
      ctx.shadowBlur=0;
      ctx.fillStyle=b.col;ctx.font='900 8.5px "Hiragino Kaku Gothic ProN",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(b.text,b.x+b.w/2,byy+7);
    }else if(b.style===7){ // ネオンクラウン(王冠アーチ)
      for(let i=0;i<3;i++){
        const pu=0.5+0.5*Math.sin(G.time*2.5+b.seed+i*0.9);
        ctx.strokeStyle=b.col;ctx.globalAlpha=pu*0.9;ctx.lineWidth=1.5;
        ctx.shadowColor=b.col;ctx.shadowBlur=6*pu;
        ctx.beginPath();ctx.arc(b.x+b.w/2,VPY-b.h,b.w*0.18+i*5,Math.PI,0);ctx.stroke();
      }
      ctx.globalAlpha=1;ctx.shadowBlur=0;
    }else if(b.style===8){ // 空を掃くサーチライト
      const ang=-Math.PI/2+Math.sin(G.time*0.4+b.seed)*0.6;
      const bx3=b.x+b.w/2,by3=VPY-b.h;
      const ex=bx3+Math.cos(ang)*175,ey=by3+Math.sin(ang)*175;
      ctx.save();ctx.globalCompositeOperation='lighter';
      const sg=ctx.createLinearGradient(bx3,by3,ex,ey);
      sg.addColorStop(0,'rgba(200,220,255,0.30)');sg.addColorStop(1,'rgba(200,220,255,0)');
      ctx.fillStyle=sg;
      const pa=ang+Math.PI/2,wE=26;
      ctx.beginPath();ctx.moveTo(bx3,by3);
      ctx.lineTo(ex+Math.cos(pa)*wE,ey+Math.sin(pa)*wE);
      ctx.lineTo(ex-Math.cos(pa)*wE,ey-Math.sin(pa)*wE);
      ctx.closePath();ctx.fill();
      ctx.restore();
      ctx.fillStyle='rgba(230,240,255,0.9)';ctx.fillRect(bx3-2,by3-3,4,3);
    }
    // ネオンエッジのタワー(たまに)
    if(b.seed>84){
      ctx.strokeStyle=b.col;ctx.globalAlpha=0.5;ctx.lineWidth=1.5;
      ctx.shadowColor=b.col;ctx.shadowBlur=5;
      ctx.strokeRect(b.x,VPY-b.h,b.w,b.h);
      ctx.globalAlpha=1;ctx.shadowBlur=0;
    }
  }
  // 街の上空を飛ぶ航空UFOの点滅灯
  for(let i=0;i<3;i++){
    const fx=((G.time*(14+i*7))+i*450)%(W+100)-50;
    const fyy=VPY-125-(i*26)%50;
    ctx.fillStyle=((G.time*3+i)|0)%2?'rgba(255,80,120,0.9)':'rgba(80,220,255,0.9)';
    ctx.fillRect(fx,fyy,3,3);
    ctx.fillStyle='rgba(180,200,255,0.25)';
    ctx.fillRect(fx-7,fyy+1,5,1.5);
  }
  ctx.restore();
}

function drawGrid(){
  ctx.save();
  const gc=css(G.col.grid);
  const eL=-ROAD_EDGE,eR=ROAD_EDGE;
  // 外側の縦線(路面の外だけ・控えめ)
  ctx.lineWidth=1.2;
  for(let k=-13;k<=13;k++){
    if(Math.abs(k*115)<ROAD_EDGE+40)continue;
    const a=proj(0.02,k*115),b=proj(1.03,k*115);
    ctx.strokeStyle=css(G.col.grid,0.07+0.05*(4-Math.min(4,Math.abs(k))));
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // 横線(流れる・全幅・控えめ)
  for(let i=0;i<13;i++){
    const tt=((i/13)+G.gridOff)%1;
    const a=proj(tt,-2200),b=proj(tt,2200);
    ctx.strokeStyle=css(G.col.grid,0.06+0.30*a.e);
    ctx.lineWidth=0.5+a.e*1.8;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // ---- 路面(はっきり暗いアスファルト面) ----
  const fL=proj(0.02,eL),fR=proj(0.02,eR),nL=proj(1.03,eL),nR=proj(1.03,eR);
  const rg=cachedGrad('road','static',()=>{
    const rg=ctx.createLinearGradient(0,VPY,0,BOTY);
    rg.addColorStop(0,'rgba(10,6,26,0.4)');rg.addColorStop(1,'rgba(8,4,22,0.92)');
    return rg;
  });
  ctx.fillStyle=rg;
  ctx.beginPath();ctx.moveTo(fL.x,fL.y);ctx.lineTo(nL.x,nL.y);ctx.lineTo(nR.x,nR.y);ctx.lineTo(fR.x,fR.y);ctx.closePath();ctx.fill();
  // 路面上の横ライン(スピード感)
  for(let i=0;i<13;i++){
    const tt=((i/13)+G.gridOff)%1;
    const a=proj(tt,eL),b=proj(tt,eR);
    ctx.strokeStyle=css(G.col.grid,0.08+0.28*a.e);
    ctx.lineWidth=0.5+a.e*1.5;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  // 現在レーンのハイライト
  if(G.state==='playing'&&!G.player.dead){
    const lo=G.player.lane*LANE_W;
    const a1=proj(0.3,lo-LANE_W*0.44),a2=proj(0.3,lo+LANE_W*0.44),b1=proj(1.03,lo-LANE_W*0.44),b2=proj(1.03,lo+LANE_W*0.44);
    ctx.fillStyle=css(G.col.acc,0.06);
    ctx.beginPath();ctx.moveTo(a1.x,a1.y);ctx.lineTo(b1.x,b1.y);ctx.lineTo(b2.x,b2.y);ctx.lineTo(a2.x,a2.y);ctx.closePath();ctx.fill();
  }
  // 路肩エッジライン(太く発光)
  for(const xo of [eL,eR]){
    const a=proj(0.02,xo),b=proj(1.03,xo);
    ctx.strokeStyle=css(G.col.grid,0.95);
    ctx.lineWidth=5;ctx.shadowColor=gc;ctx.shadowBlur=18;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  ctx.shadowBlur=0;
  // 車線境界(流れる白破線・5レーン分)
  for(const xo of [-LANE_W*1.5,-LANE_W*0.5,LANE_W*0.5,LANE_W*1.5]){
    ctx.strokeStyle='rgba(255,255,255,0.85)';
    ctx.shadowColor='#ffffff';ctx.shadowBlur=6;
    for(let i=0;i<9;i++){
      const t0=((i/9)+G.gridOff)%1,t1=Math.min(1.03,t0+0.045);
      const a=proj(t0,xo),b=proj(t1,xo);
      ctx.lineWidth=1+a.e*2.5;
      ctx.globalAlpha=0.15+0.65*a.e;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }
    ctx.globalAlpha=1;ctx.shadowBlur=0;
  }
  ctx.restore();
}
function drawSpeedStreaks(){ // 疾走感の放射スピードライン
  const sp=G.speed+(G.pw.boost>0?0.4:0)+(G.bonus?0.3:0);
  if(sp<0.55||G.state!=='playing')return;
  const inten=Math.min(1,(sp-0.55)/0.6);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const cx2=W/2,cy2=H*0.42;
  for(let i=0;i<12;i++){
    const ang=(i/12)*6.28+(i%2?0.26:0);
    const rr=((G.time*(500+i*90))%430)+300;
    const x1=cx2+Math.cos(ang)*rr,y1=cy2+Math.sin(ang)*rr*0.8;
    if(x1>170&&x1<W-170&&y1>90&&y1<H-140)continue; // 中央の視界は塞がない
    const len=45+inten*80;
    ctx.strokeStyle=`rgba(180,230,255,${0.09+0.16*inten})`;
    ctx.lineWidth=2.2;
    ctx.beginPath();ctx.moveTo(x1,y1);
    ctx.lineTo(cx2+Math.cos(ang)*(rr+len),cy2+Math.sin(ang)*(rr+len)*0.8);
    ctx.stroke();
  }
  ctx.restore();
}

// ---- ワールドオブジェクト描画 ----
function drawWorld(){
  const list=[];
  for(const o of G.obs)list.push({t:o.t,fn:()=>drawObstacle(o)});
  for(const it of G.items)list.push({t:it.t,fn:()=>drawItem(it)});
  for(const pr of G.props)list.push({t:pr.t,fn:()=>drawProp(pr)});
  for(const g of G.groups)list.push({t:g.t,fn:()=>g.kind==='dt'?drawDriveThru(g):drawBuilding(g)});
  for(const r of G.rockets)list.push({t:r.t,fn:()=>drawRocket(r)});
  list.sort((a,b)=>a.t-b.t);
  for(const e of list)e.fn();
  // 追跡イベント(横切り)
  if(G.chase){
    const pz=proj(0.55,0);
    const x=lerp(-100,W+100,Math.min(1,G.chase.t));
    drawAlienFigure(x,pz.y-14,pz.s*2.4,G.time*8,'#aaffaa');
    // 警察UFO
    const px2=x-130,ps=pz.s*2.2;
    ctx.save();
    ctx.fillStyle='#223';ctx.strokeStyle='#8899bb';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(px2,pz.y-30,26*ps,9*ps,0,0,6.28);ctx.fill();ctx.stroke();
    ctx.fillStyle=(G.time*6|0)%2?'#ff2b4e':'#00a2ff';
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=14;
    ctx.fillRect(px2-5*ps,pz.y-30-14*ps,10*ps,7*ps);
    ctx.restore();
  }
}
// 燃える隕石: 灰色の多面体の岩 + 周囲をゆらめく赤い炎 + 漂う火の粉
function drawMeteor(r,sd,rot){
  const t=G.time;
  // ゆらめく炎(shadowBlurは重いので使わず、外周の淡いレイヤーでグロー風にする)
  ctx.save();
  ctx.rotate(t*0.4+sd);
  for(const[mul,col,alpha]of[[2.05,'#e0392a',0.18],[1.72,'#e0392a',0.8],[1.36,'#ff6a4e',0.9]]){
    ctx.fillStyle=col;ctx.globalAlpha=alpha;
    ctx.beginPath();
    for(let i=0;i<12;i++){
      const a=i/12*6.28;
      const spike=(i%2?0.68:1)+0.18*Math.sin(t*3.2+i*2.1+sd);
      const rr=r*mul*spike;
      const px=Math.cos(a)*rr,py=Math.sin(a)*rr;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
  // ふわふわ漂う火の粉
  ctx.save();
  ctx.fillStyle='#ff8a65';
  for(let i=0;i<4;i++){
    const a=t*0.9+i*1.57+sd;
    const rr=r*(1.75+0.3*Math.sin(t*1.8+i*2.4+sd));
    ctx.globalAlpha=0.35+0.35*Math.sin(t*2.6+i*1.7);
    ctx.beginPath();ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr*0.85,Math.max(1.2,r*0.09),0,6.28);ctx.fill();
  }
  ctx.restore();
  // 岩本体(灰色の多面体・面ごとに明暗をつける)
  ctx.save();
  ctx.rotate(rot||0);
  const vs=[];
  for(let i=0;i<7;i++){
    const a=i/7*6.28;
    const rr=r*(0.78+0.26*Math.sin(i*2.7+sd));
    vs.push([Math.cos(a)*rr,Math.sin(a)*rr]);
  }
  ctx.fillStyle='#8b929c';
  ctx.strokeStyle='#2b2f38';ctx.lineWidth=Math.max(1.5,r*0.09);
  ctx.beginPath();vs.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
  ctx.fill();ctx.stroke();
  ctx.fillStyle='#bcc2ca'; // 上面(明)
  ctx.beginPath();
  ctx.moveTo(vs[4][0],vs[4][1]);ctx.lineTo(vs[5][0],vs[5][1]);ctx.lineTo(vs[6][0],vs[6][1]);
  ctx.lineTo(vs[5][0]*0.22,vs[5][1]*0.22);ctx.closePath();ctx.fill();
  ctx.fillStyle='#565c66'; // 下面(暗)
  ctx.beginPath();
  ctx.moveTo(vs[1][0],vs[1][1]);ctx.lineTo(vs[2][0],vs[2][1]);ctx.lineTo(vs[3][0],vs[3][1]);
  ctx.lineTo(vs[2][0]*0.22,vs[2][1]*0.22);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawObstacle(o){
  const pz=proj(o.t,(o.laneF||0)*LANE_W);
  const s=pz.s;
  if(o.type!=='laser')groundShadow(pz.x,pz.y+7*s,(o.type==='ufo'?30:24)*s,0.45);
  ctx.save();ctx.translate(pz.x,pz.y);
  if(o.type==='ast'||o.type==='spin'){
    const r=24*s;
    drawMeteor(r,o.sd||0,o.rot||0);
    if(o.type==='spin'){ctx.strokeStyle='rgba(255,213,79,0.7)';ctx.lineWidth=2*s;ctx.beginPath();ctx.arc(0,0,r*2.0,o.rot,o.rot+1.6);ctx.stroke();}
  }else if(o.type==='debris'){
    ctx.rotate(o.rot||0);
    const r=18*s;
    ctx.strokeStyle='#8899aa';
    ctx.fillStyle='rgba(20,8,30,0.9)';
    ctx.lineWidth=2*s;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=8*s;
    ctx.beginPath();
    for(let i=0;i<7;i++){
      const a=i/7*6.28,rr=r*(0.75+0.3*Math.sin(i*2.7+(o.rot||0)*0.3+1));
      i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
    }
    ctx.closePath();ctx.fill();ctx.stroke();
  }else if(o.type==='ufo'){
    ctx.strokeStyle='#ff2b4e';ctx.fillStyle='rgba(30,5,15,0.9)';
    ctx.lineWidth=2*s;ctx.shadowColor='#ff2b4e';ctx.shadowBlur=10*s;
    ctx.beginPath();ctx.ellipse(0,0,30*s,10*s,0,0,6.28);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(0,-6*s,11*s,Math.PI,0);ctx.stroke();
    ctx.fillStyle='#ff2b4e';
    for(let i=-1;i<=1;i++)ctx.fillRect(i*14*s-2*s,2*s,4*s,3*s);
  }else if(o.type==='laser'){
    const on=((G.time*0.8+o.phase)%1)<0.5;
    // 両脇パイロン
    for(const side of [-1,1]){
      const px2=proj(o.t,side*LANE_W*2.6);
      ctx.save();ctx.translate(px2.x,px2.y);
      ctx.fillStyle='#1a1030';ctx.strokeStyle=css(G.col.acc);ctx.lineWidth=2*s;
      ctx.shadowColor=css(G.col.acc);ctx.shadowBlur=8;
      ctx.beginPath();ctx.rect(-6*s,-56*s,12*s,56*s);ctx.fill();ctx.stroke();
      ctx.fillStyle=on?'#ff2b4e':'#333344';ctx.beginPath();ctx.arc(0,-56*s,5*s,0,6.28);ctx.fill();
      ctx.restore();
    }
    if(on){
      const a=proj(o.t,-LANE_W*2.6),b=proj(o.t,LANE_W*2.6);
      ctx.save();ctx.strokeStyle='#ff2b4e';ctx.lineWidth=4*s;ctx.shadowColor='#ff2b4e';ctx.shadowBlur=16;
      ctx.globalAlpha=0.7+0.3*Math.sin(G.time*30);
      ctx.beginPath();ctx.moveTo(a.x,a.y-30*s);ctx.lineTo(b.x,b.y-30*s);ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();
}
function drawItem(it){
  const pz=proj(it.t,it.laneF*LANE_W);
  const s=pz.s;
  const bob=Math.sin(G.time*4+it.t*10)*4*s;
  groundShadow(pz.x,pz.y+3*s,(10-bob*0.4)*s,0.35);
  ctx.save();ctx.translate(pz.x,pz.y-18*s);
  ctx.translate(0,bob);
  if(it.type==='crystal'||it.type==='rare'){
    const col=it.type==='rare'?'#ffd54f':'#00e5ff';
    const r=(it.type==='rare'?16:11)*s;
    ctx.rotate(it.rot);
    ctx.strokeStyle=col;ctx.fillStyle=it.type==='rare'?'rgba(80,60,0,0.6)':'rgba(0,40,60,0.6)';
    ctx.lineWidth=2*s;ctx.shadowColor=col;ctx.shadowBlur=12*s;
    ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r*0.7,0);ctx.lineTo(0,r);ctx.lineTo(-r*0.7,0);ctx.closePath();
    ctx.fill();ctx.stroke();
  }else{
    const icons={shield:['◎','#00e5ff'],boost:['⚡','#ff9100'],magnet:['U','#ff2bd6'],slow:['◷','#7c4dff'],mystery:['?','#ffd54f']};
    const[ic,col]=icons[it.type]||['?','#fff'];
    ctx.strokeStyle=col;ctx.fillStyle='rgba(10,5,25,0.85)';
    ctx.lineWidth=2*s;ctx.shadowColor=col;ctx.shadowBlur=12*s;
    const r=15*s;
    ctx.beginPath();ctx.rect(-r,-r,r*2,r*2);ctx.fill();ctx.stroke();
    ctx.fillStyle=col;ctx.font=`900 ${18*s}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(ic,0,1);
  }
  ctx.restore();
}
function drawAlienFigure(x,y,s,ph,col){
  groundShadow(x,y+2*s,7*s,0.35);
  ctx.save();ctx.translate(x,y);
  ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,2*s);
  ctx.shadowColor=col;ctx.shadowBlur=6*s;
  // 頭
  ctx.beginPath();ctx.arc(0,-22*s,6*s,0,6.28);ctx.stroke();
  // アンテナ
  ctx.beginPath();ctx.moveTo(0,-28*s);ctx.lineTo(0,-33*s);ctx.stroke();
  ctx.beginPath();ctx.arc(0,-34*s,1.5*s,0,6.28);ctx.stroke();
  // 体
  ctx.beginPath();ctx.moveTo(0,-16*s);ctx.lineTo(0,-4*s);ctx.stroke();
  // 脚(歩き)
  const sw=Math.sin(ph)*5*s;
  ctx.beginPath();ctx.moveTo(0,-4*s);ctx.lineTo(-3*s+sw,0);ctx.moveTo(0,-4*s);ctx.lineTo(3*s-sw,0);ctx.stroke();
  // 腕
  ctx.beginPath();ctx.moveTo(0,-14*s);ctx.lineTo(-6*s,-10*s+sw*0.5);ctx.moveTo(0,-14*s);ctx.lineTo(6*s,-10*s-sw*0.5);ctx.stroke();
  ctx.restore();
}
function drawProp(pr){
  const pz=proj(pr.t,pr.xoff);
  const s=pz.s*2.3;   // 路肩キャラは大きめに描く(PCワイド画面向け)
  if(s<0.45&&pr.type!=='lamp')return; // 街灯は遠くから見せる
  const sd=Math.abs(pr.xoff*0.7137)%100; // 形状用の固定シード(ph は動きの位相なので形状に使わない)
  ctx.save();
  const acc=css(G.col.acc);
  switch(pr.type){
    case 'hitch':{
      drawAlienFigure(pz.x,pz.y,s,Math.sin(pr.ph)*0.5,'#aaffcc');
      // プラカード
      ctx.translate(pz.x+10*s,pz.y-30*s);
      ctx.fillStyle='rgba(20,10,35,0.9)';ctx.strokeStyle=acc;ctx.lineWidth=1.5*s;
      ctx.shadowColor=acc;ctx.shadowBlur=5;
      const pw=Math.max(60,pr.line.length*11)*s;
      ctx.fillRect(-4*s,-16*s,pw,19*s);ctx.strokeRect(-4*s,-16*s,pw,19*s);
      if(s>0.8){ctx.fillStyle='#fff';ctx.font=`700 ${10*s}px "Hiragino Kaku Gothic ProN",sans-serif`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(pr.line,0,-6.5*s);}
      break;}
    case 'jog':{
      drawAlienFigure(pz.x,pz.y,s,pr.ph*3,'#ffcc88');
      break;}
    case 'music':{
      drawAlienFigure(pz.x,pz.y,s,0.3,'#cc99ff');
      ctx.strokeStyle='#cc99ff';ctx.lineWidth=1.5*s;
      ctx.beginPath();ctx.moveTo(pz.x+7*s,pz.y-2*s);ctx.lineTo(pz.x+7*s,pz.y-18*s);ctx.stroke();
      // 音符
      if(s>0.7){ctx.fillStyle='#cc99ff';ctx.font=`${12*s}px sans-serif`;ctx.fillText('♪',pz.x+12*s+Math.sin(pr.ph)*6,pz.y-32*s);}
      break;}
    case 'protest':{
      for(let i=0;i<3;i++)drawAlienFigure(pz.x+(i-1)*13*s,pz.y,s*0.9,Math.sin(pr.ph+i)*0.6,'#ffaaaa');
      ctx.fillStyle='rgba(35,10,10,0.9)';ctx.strokeStyle='#ff5252';ctx.lineWidth=1.5*s;
      const pw2=Math.max(50,pr.line.length*11.5)*s;
      ctx.fillRect(pz.x-pw2/2,pz.y-58*s,pw2,19*s);ctx.strokeRect(pz.x-pw2/2,pz.y-58*s,pw2,19*s);
      if(s>0.8){ctx.fillStyle='#fff';ctx.font=`700 ${10*s}px "Hiragino Kaku Gothic ProN",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(pr.line,pz.x,pz.y-48*s);}
      break;}
    case 'vendor':{
      ctx.fillStyle='rgba(25,12,40,0.95)';ctx.strokeStyle='#ffd54f';ctx.lineWidth=1.5*s;
      ctx.shadowColor='#ffd54f';ctx.shadowBlur=6;
      ctx.fillRect(pz.x-20*s,pz.y-26*s,40*s,26*s);ctx.strokeRect(pz.x-20*s,pz.y-26*s,40*s,26*s);
      ctx.beginPath();ctx.moveTo(pz.x-24*s,pz.y-26*s);ctx.lineTo(pz.x,pz.y-38*s);ctx.lineTo(pz.x+24*s,pz.y-26*s);ctx.closePath();ctx.stroke();
      drawAlienFigure(pz.x,pz.y-2*s,s*0.7,0,'#ffd54f');
      break;}
    case 'pet':{
      ctx.strokeStyle='#88ffee';ctx.lineWidth=1.5*s;ctx.shadowColor='#88ffee';ctx.shadowBlur=5;
      ctx.beginPath();ctx.ellipse(pz.x,pz.y-6*s,8*s,5*s,0,0,6.28);ctx.stroke();
      ctx.beginPath();ctx.arc(pz.x+8*s,pz.y-10*s,3*s,0,6.28);ctx.stroke();
      const sw=Math.sin(pr.ph*2)*3*s;
      ctx.beginPath();
      for(const lx of [-5,-2,2,5]){ctx.moveTo(pz.x+lx*s,pz.y-2*s);ctx.lineTo(pz.x+lx*s+(lx<0?sw:-sw)*0.3,pz.y+2*s);}
      ctx.stroke();
      break;}
    case 'robot':{
      const spark=Math.random()<0.05;
      ctx.strokeStyle=spark?'#ffffff':'#8899ff';ctx.lineWidth=1.5*s;ctx.shadowColor='#8899ff';ctx.shadowBlur=5;
      ctx.strokeRect(pz.x-6*s,pz.y-20*s,12*s,12*s);
      ctx.strokeRect(pz.x-8*s,pz.y-8*s,16*s,8*s);
      if(spark){ctx.fillStyle='#ffd54f';for(let k=0;k<4;k++)ctx.fillRect(pz.x+rnd(-10,10)*s,pz.y-22*s+rnd(-4,4),2,2);}
      break;}
    case 'bdance':{
      groundShadow(pz.x,pz.y,14*s);
      ctx.save();ctx.translate(pz.x,pz.y-14*s);ctx.rotate(pr.ph*2);
      ctx.strokeStyle='#ff2bd6';ctx.fillStyle='rgba(30,5,25,0.9)';ctx.lineWidth=2*s;
      ctx.shadowColor='#ff2bd6';ctx.shadowBlur=8;
      ctx.beginPath();ctx.ellipse(0,0,16*s,6*s,0,0,6.28);ctx.fill();ctx.stroke();
      ctx.restore();
      break;}
    case 'palm':{ // ネオンヤシの木
      groundShadow(pz.x,pz.y,12*s,0.35);
      const bend=pr.side*-14*s, hh=56*s;
      ctx.strokeStyle='#ff2bd6';ctx.lineWidth=2.5*s;ctx.shadowColor='#ff2bd6';ctx.shadowBlur=8;
      ctx.beginPath();ctx.moveTo(pz.x,pz.y);ctx.quadraticCurveTo(pz.x+bend*0.3,pz.y-hh*0.6,pz.x+bend,pz.y-hh);ctx.stroke();
      ctx.strokeStyle=css(G.col.acc);ctx.shadowColor=css(G.col.acc);
      for(let i=0;i<6;i++){
        const a=-Math.PI/2+(i-2.5)*0.5+Math.sin(G.time+pr.ph)*0.04;
        ctx.beginPath();ctx.moveTo(pz.x+bend,pz.y-hh);
        ctx.quadraticCurveTo(pz.x+bend+Math.cos(a)*22*s,pz.y-hh+Math.sin(a)*22*s-6*s,pz.x+bend+Math.cos(a)*34*s,pz.y-hh+Math.sin(a)*30*s);
        ctx.stroke();
      }
      break;}
    case 'crys':{ // 巨大結晶
      groundShadow(pz.x,pz.y,16*s,0.35);
      const col=css(G.col.acc);
      ctx.strokeStyle=col;ctx.fillStyle=css(G.col.acc,0.15);ctx.lineWidth=2*s;
      ctx.shadowColor=col;ctx.shadowBlur=12;
      for(const[dx,hh,ww]of[[0,52,13],[-13,30,9],[12,36,10]]){
        ctx.beginPath();
        ctx.moveTo(pz.x+dx*s,pz.y);ctx.lineTo(pz.x+(dx-ww)*s,pz.y-hh*0.55*s);
        ctx.lineTo(pz.x+dx*s,pz.y-hh*s);ctx.lineTo(pz.x+(dx+ww)*s,pz.y-hh*0.55*s);ctx.closePath();
        ctx.fill();ctx.stroke();
      }
      break;}
    case 'rock':{ // 燃える隕石
      groundShadow(pz.x,pz.y+2*s,20*s,0.4);
      ctx.save();ctx.translate(pz.x,pz.y-16*s);
      drawMeteor(17*s,sd,sd);
      ctx.restore();
      break;}
    case 'ringpost':{ // リングワールドの柱
      groundShadow(pz.x,pz.y,10*s,0.35);
      const hh=64*s;
      ctx.strokeStyle='#00e5ff';ctx.lineWidth=3*s;ctx.shadowColor='#00e5ff';ctx.shadowBlur=10;
      ctx.beginPath();ctx.moveTo(pz.x,pz.y);ctx.lineTo(pz.x,pz.y-hh);ctx.stroke();
      ctx.beginPath();ctx.arc(pz.x,pz.y-hh-14*s,14*s,0,6.28);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=1.5*s;
      ctx.beginPath();ctx.arc(pz.x,pz.y-hh-14*s,8*s,G.time*2,G.time*2+4);ctx.stroke();
      break;}
    case 'junk': case 'wreck':{ // 廃棄物の山/難破船
      groundShadow(pz.x,pz.y+2*s,24*s,0.4);
      ctx.strokeStyle='#00ffb3';ctx.fillStyle='rgba(18,22,20,0.95)';ctx.lineWidth=1.5*s;
      ctx.shadowColor='#00ffb3';ctx.shadowBlur=6;
      if(pr.type==='junk'){
        for(const[dx,dy,ww,hh]of[[-14,0,16,14],[2,0,20,20],[-6,-16,14,10],[14,-4,10,12]]){
          ctx.fillRect(pz.x+dx*s,pz.y-(dy+hh)*s,ww*s,hh*s);ctx.strokeRect(pz.x+dx*s,pz.y-(dy+hh)*s,ww*s,hh*s);
        }
        if(Math.random()<0.03){ctx.fillStyle='#ccffcc';ctx.fillRect(pz.x+rnd(-16,16)*s,pz.y-rnd(10,30)*s,2,2);}
      }else{
        // 難破UFO(半分埋まった円盤)
        ctx.save();ctx.translate(pz.x,pz.y-6*s);ctx.rotate(0.5*pr.side);
        ctx.beginPath();ctx.ellipse(0,0,30*s,10*s,0,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();
        ctx.beginPath();ctx.arc(0,-4*s,10*s,Math.PI,0);ctx.stroke();
        ctx.restore();
      }
      break;}
    case 'obelisk':{ // 浮遊オベリスク
      const bob2=Math.sin(G.time*1.5+pr.ph)*6*s;
      groundShadow(pz.x,pz.y,14*s,0.3+0.1*Math.sin(G.time*1.5+pr.ph));
      ctx.strokeStyle='#c400ff';ctx.fillStyle='rgba(30,0,45,0.9)';ctx.lineWidth=2*s;
      ctx.shadowColor='#c400ff';ctx.shadowBlur=14;
      ctx.save();ctx.translate(pz.x,pz.y-40*s+bob2);
      ctx.beginPath();ctx.moveTo(0,-26*s);ctx.lineTo(11*s,10*s);ctx.lineTo(0,26*s);ctx.lineTo(-11*s,10*s);ctx.closePath();
      ctx.fill();ctx.stroke();
      ctx.fillStyle='#ff80ff';ctx.fillRect(-1.5*s,-8*s,3*s,16*s);
      ctx.restore();
      break;}
    case 'flower':{ // 発光する宇宙花
      const col=(sd|0)%2?'#ff2bd6':'#00e5ff';
      const pulse=0.7+0.3*Math.sin(G.time*3+pr.ph);
      groundShadow(pz.x,pz.y,6*s,0.3);
      ctx.strokeStyle=col;ctx.lineWidth=1.5*s;ctx.shadowColor=col;ctx.shadowBlur=8*pulse;
      const hh=(18+8*rndSeeded(sd))*s;
      ctx.beginPath();ctx.moveTo(pz.x,pz.y);ctx.quadraticCurveTo(pz.x+4*s,pz.y-hh*0.6,pz.x,pz.y-hh);ctx.stroke();
      ctx.fillStyle=col;ctx.globalAlpha=pulse;
      for(let i=0;i<5;i++){const a=i/5*6.28+G.time*0.4;
        ctx.beginPath();ctx.ellipse(pz.x+Math.cos(a)*5*s,pz.y-hh+Math.sin(a)*5*s,3.5*s,1.8*s,a,0,6.28);ctx.fill();}
      ctx.globalAlpha=1;ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.arc(pz.x,pz.y-hh,2*s,0,6.28);ctx.fill();
      break;}
    case 'billboard':{ // ロードサイドのネオン看板
      const big=pr.big?1.5:1;
      groundShadow(pz.x,pz.y,26*s*big,0.4);
      const bw=(Math.max(70,pr.line.length*15.5)+14)*s*big,bh=34*s*big,by=pz.y-(46+22*rndSeeded(sd))*s*big;
      ctx.strokeStyle='#556';ctx.lineWidth=2.5*s;
      ctx.beginPath();ctx.moveTo(pz.x-8*s,pz.y);ctx.lineTo(pz.x-8*s,by+bh);ctx.moveTo(pz.x+8*s,pz.y);ctx.lineTo(pz.x+8*s,by+bh);ctx.stroke();
      const bcol=(sd|0)%2?'#ffd54f':css(G.col.acc);
      ctx.fillStyle='rgba(12,6,26,0.95)';ctx.strokeStyle=bcol;ctx.lineWidth=2*s;
      ctx.shadowColor=bcol;ctx.shadowBlur=10;
      ctx.fillRect(pz.x-bw/2,by,bw,bh);ctx.strokeRect(pz.x-bw/2,by,bw,bh);
      // 縁の電球(順番に点滅)
      ctx.fillStyle='#fff';
      for(let i=0;i<8;i++){if(((G.time*6|0)+i)%4===0)continue;
        ctx.fillRect(pz.x-bw/2+4*s+i*(bw-8*s)/7-1,by-3*s,2.5*s,2.5*s);}
      if(s>0.6){ctx.fillStyle=bcol;ctx.font=`900 ${13.5*s*big}px "Hiragino Kaku Gothic ProN",sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(pr.line,pz.x,by+bh/2);}
      break;}
    case 'lantern':{ // 浮遊ランタン
      const fy=pz.y-(30+26*rndSeeded(sd))*s+Math.sin(G.time*1.6+pr.ph)*7*s;
      const col=(sd|0)%2?'#ffd54f':'#ff80ff';
      groundShadow(pz.x,pz.y,5*s,0.22);
      ctx.save();ctx.globalCompositeOperation='lighter';
      const gr=ctx.createRadialGradient(pz.x,fy,0,pz.x,fy,14*s);
      gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=0.5+0.2*Math.sin(G.time*3+pr.ph);
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(pz.x,fy,14*s,0,6.28);ctx.fill();
      ctx.restore();
      ctx.fillStyle=col;ctx.strokeStyle='#fff';ctx.lineWidth=1;
      ctx.fillRect(pz.x-3.5*s,fy-4.5*s,7*s,9*s);ctx.strokeRect(pz.x-3.5*s,fy-4.5*s,7*s,9*s);
      break;}
    case 'arch':{ // 岩のアーチ
      groundShadow(pz.x,pz.y+2*s,40*s,0.4);
      ctx.strokeStyle='#ff9100';ctx.fillStyle='rgba(40,15,8,0.95)';ctx.lineWidth=2.5*s;
      ctx.shadowColor='#ff9100';ctx.shadowBlur=8;
      const aw=42*s,ah=52*s;
      ctx.beginPath();
      ctx.moveTo(pz.x-aw,pz.y);ctx.lineTo(pz.x-aw+6*s,pz.y-ah*0.7);ctx.quadraticCurveTo(pz.x,pz.y-ah*1.25,pz.x+aw-6*s,pz.y-ah*0.7);ctx.lineTo(pz.x+aw,pz.y);
      ctx.lineTo(pz.x+aw*0.55,pz.y);ctx.quadraticCurveTo(pz.x,pz.y-ah*0.62,pz.x-aw*0.55,pz.y);ctx.closePath();
      ctx.fill();ctx.stroke();
      break;}
    case 'vent':{ // 溶岩噴気孔(火の粉が舞う)
      groundShadow(pz.x,pz.y+2*s,18*s,0.4);
      ctx.fillStyle='rgba(40,15,8,0.95)';ctx.strokeStyle='#ff5222';ctx.lineWidth=2*s;
      ctx.shadowColor='#ff5222';ctx.shadowBlur=10;
      ctx.beginPath();ctx.moveTo(pz.x-16*s,pz.y);ctx.quadraticCurveTo(pz.x,pz.y-26*s,pz.x+16*s,pz.y);ctx.closePath();
      ctx.fill();ctx.stroke();
      const glow=0.5+0.5*Math.sin(G.time*5+pr.ph);
      ctx.fillStyle=`rgba(255,120,30,${0.6*glow})`;
      ctx.beginPath();ctx.ellipse(pz.x,pz.y-13*s,6*s,3*s,0,0,6.28);ctx.fill();
      ctx.fillStyle='#ffb366';
      for(let i=0;i<4;i++){
        const fr=((G.time*(0.5+0.2*i)+pr.ph+i*0.7)%1);
        ctx.globalAlpha=1-fr;
        ctx.fillRect(pz.x+Math.sin(G.time*2+i*2)*8*s,pz.y-13*s-fr*40*s,2.2*s,2.2*s);
      }
      ctx.globalAlpha=1;
      break;}
    case 'rig':{ // 採掘リグ(点滅灯つき)
      groundShadow(pz.x,pz.y+2*s,24*s,0.4);
      const hh=70*s;
      ctx.strokeStyle='#ffd54f';ctx.lineWidth=1.8*s;ctx.shadowColor='#ffd54f';ctx.shadowBlur=5;
      ctx.beginPath();
      ctx.moveTo(pz.x-18*s,pz.y);ctx.lineTo(pz.x,pz.y-hh);ctx.lineTo(pz.x+18*s,pz.y);
      ctx.moveTo(pz.x-12*s,pz.y-hh*0.33);ctx.lineTo(pz.x+12*s,pz.y-hh*0.33);
      ctx.moveTo(pz.x-7*s,pz.y-hh*0.66);ctx.lineTo(pz.x+7*s,pz.y-hh*0.66);
      ctx.moveTo(pz.x-12*s,pz.y-hh*0.33);ctx.lineTo(pz.x+7*s,pz.y-hh*0.66);
      ctx.moveTo(pz.x+12*s,pz.y-hh*0.33);ctx.lineTo(pz.x-7*s,pz.y-hh*0.66);
      ctx.stroke();
      if((G.time*2+pr.ph|0)%2){ctx.fillStyle='#ff2b4e';ctx.shadowColor='#ff2b4e';ctx.shadowBlur=12;
        ctx.beginPath();ctx.arc(pz.x,pz.y-hh-4*s,3.5*s,0,6.28);ctx.fill();}
      break;}
    case 'arcgate':{ // リングワールドの大アーチ
      groundShadow(pz.x,pz.y+2*s,46*s,0.35);
      const rr=(pr.big?72:52)*s;
      ctx.strokeStyle='#00e5ff';ctx.lineWidth=4*s;ctx.shadowColor='#00e5ff';ctx.shadowBlur=14;
      ctx.beginPath();ctx.arc(pz.x,pz.y,rr,Math.PI,0);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5*s;
      ctx.beginPath();ctx.arc(pz.x,pz.y,rr*0.85,Math.PI,0);ctx.stroke();
      // アーチ内の流れる光
      const fl=(G.time*0.8+pr.ph)%1;
      const fa=Math.PI+fl*Math.PI;
      ctx.fillStyle='#fff';ctx.shadowBlur=10;
      ctx.beginPath();ctx.arc(pz.x+Math.cos(fa)*rr,pz.y+Math.sin(fa)*rr,3*s,0,6.28);ctx.fill();
      break;}
    case 'orb':{ // 浮遊オーブ
      const fy=pz.y-(36+20*rndSeeded(sd))*s+Math.sin(G.time*1.2+pr.ph)*8*s;
      groundShadow(pz.x,pz.y,10*s,0.25);
      ctx.strokeStyle='#00e5ff';ctx.lineWidth=1.8*s;ctx.shadowColor='#00e5ff';ctx.shadowBlur=12;
      const gr2=ctx.createRadialGradient(pz.x-3*s,fy-3*s,1,pz.x,fy,11*s);
      gr2.addColorStop(0,'rgba(200,255,255,0.95)');gr2.addColorStop(1,'rgba(0,90,140,0.75)');
      ctx.fillStyle=gr2;
      ctx.beginPath();ctx.arc(pz.x,fy,11*s,0,6.28);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.ellipse(pz.x,fy,17*s,5*s,-0.3,0,6.28);ctx.stroke();
      break;}
    case 'statue':{ // 古代宇宙人像
      groundShadow(pz.x,pz.y+2*s,20*s,0.45);
      ctx.fillStyle='rgba(25,25,40,0.97)';ctx.strokeStyle='#8899bb';ctx.lineWidth=2*s;
      ctx.shadowColor='#8899bb';ctx.shadowBlur=4;
      // 台座+頭像(モアイ風)
      ctx.fillRect(pz.x-16*s,pz.y-14*s,32*s,14*s);ctx.strokeRect(pz.x-16*s,pz.y-14*s,32*s,14*s);
      ctx.beginPath();
      ctx.moveTo(pz.x-11*s,pz.y-14*s);ctx.lineTo(pz.x-13*s,pz.y-52*s);ctx.quadraticCurveTo(pz.x,pz.y-64*s,pz.x+13*s,pz.y-52*s);ctx.lineTo(pz.x+11*s,pz.y-14*s);ctx.closePath();
      ctx.fill();ctx.stroke();
      // 目が光る
      const gl=0.5+0.5*Math.sin(G.time*2+pr.ph);
      ctx.fillStyle=`rgba(0,229,255,${gl})`;ctx.shadowColor='#00e5ff';ctx.shadowBlur=10;
      ctx.fillRect(pz.x-8*s,pz.y-46*s,5*s,2.5*s);ctx.fillRect(pz.x+3*s,pz.y-46*s,5*s,2.5*s);
      break;}
    case 'scraptower':{ // スクラップタワー
      groundShadow(pz.x,pz.y+2*s,22*s,0.45);
      ctx.strokeStyle='#00ffb3';ctx.fillStyle='rgba(18,22,20,0.95)';ctx.lineWidth=1.5*s;
      ctx.shadowColor='#00ffb3';ctx.shadowBlur=5;
      let ty=pz.y,tw=34*s;
      for(let i=0;i<5;i++){
        const th=(12+6*rndSeeded(sd+i))*s,off=(rndSeeded(sd*2+i)-0.5)*10*s;
        ctx.fillRect(pz.x-tw/2+off,ty-th,tw,th);ctx.strokeRect(pz.x-tw/2+off,ty-th,tw,th);
        ty-=th;tw*=0.78;
      }
      ctx.strokeStyle='#ff2b4e';ctx.beginPath();ctx.moveTo(pz.x,ty);ctx.lineTo(pz.x,ty-14*s);ctx.stroke();
      if((G.time*3|0)%2){ctx.fillStyle='#ff2b4e';ctx.beginPath();ctx.arc(pz.x,ty-15*s,2.5*s,0,6.28);ctx.fill();}
      break;}
    case 'firebarrel':{ // ドラム缶の焚き火
      groundShadow(pz.x,pz.y+2*s,12*s,0.4);
      ctx.fillStyle='rgba(30,20,25,0.97)';ctx.strokeStyle='#996655';ctx.lineWidth=1.5*s;
      ctx.fillRect(pz.x-8*s,pz.y-16*s,16*s,16*s);ctx.strokeRect(pz.x-8*s,pz.y-16*s,16*s,16*s);
      // 炎(ゆらぎ)
      ctx.save();ctx.globalCompositeOperation='lighter';
      for(let i=0;i<3;i++){
        const fh=(14+8*Math.sin(G.time*(6+i)+pr.ph+i*2))*s;

function drawDriveThru(g){
  const s=proj(g.t,0).s;
  const reveal=!g.fast||g.t>0.55;
  // 店舗(通常は片側のみ・高速版は両側に建ち正解側が直前に判明)
  const sides=g.fast?[-1,1]:[g.side];
  for(const side of sides)drawShop(g,side,side===g.side,reveal);
  // 正解レーンの誘導(強発光ストリップ+エッジライン+流れるシェブロン+受取パッド)
  if(reveal){
    const lo=g.correct*LANE_W;
    const t1=Math.min(1.0,g.t),t0=Math.max(0.06,g.t-0.5);
    const pulse=0.7+0.3*Math.sin(G.time*7);

    const a1=proj(t0,lo-LANE_W*0.42),a2=proj(t0,lo+LANE_W*0.42),b1=proj(t1,lo-LANE_W*0.42),b2=proj(t1,lo+LANE_W*0.42);

    ctx.fillStyle=sg;
    ctx.beginPath();ctx.moveTo(a1.x,a1.y);ctx.lineTo(b1.x,b1.y);ctx.lineTo(b2.x,b2.y);ctx.lineTo(a2.x,a2.y);ctx.closePath();ctx.fill();

    ctx.strokeStyle='#00ffb3';ctx.shadowColor='#00ffb3';
    for(const xo of [lo-LANE_W*0.42,lo+LANE_W*0.42]){

      ctx.globalAlpha=0.9*pulse;ctx.lineWidth=4;ctx.shadowBlur=18;

    for(let i=0;i<5;i++){
      const f=((i/5)+G.time*0.55)%1;
      const tt=t0+f*(t1-t0);
      const cA=proj(tt,lo-LANE_W*0.26),cB=proj(tt+0.018,lo),cC=proj(tt,lo+LANE_W*0.26);
      ctx.globalAlpha=(0.35+0.6*f)*pulse;
      ctx.beginPath();ctx.moveTo(cA.x,cA.y);ctx.lineTo(cB.x,cB.y);ctx.lineTo(cC.x,cC.y);ctx.stroke();
    }
    // 受取パッド(店の窓の前で脈動する発光エリア)
    const pz=proj(g.t,lo);
    const pr2=LANE_W*0.5*pz.xe*(1+0.12*Math.sin(G.time*7));
    const pg2=ctx.createRadialGradient(pz.x,pz.y,0,pz.x,pz.y,pr2);
    pg2.addColorStop(0,`rgba(180,255,225,${0.55*pulse})`);
    pg2.addColorStop(0.6,`rgba(0,255,179,${0.30*pulse})`);
    pg2.addColorStop(1,'rgba(0,255,179,0)');
    ctx.globalAlpha=1;ctx.fillStyle=pg2;
    ctx.beginPath();ctx.ellipse(pz.x,pz.y,pr2,pr2*0.4,0,0,6.28);ctx.fill();
    ctx.strokeStyle='#aaffe0';ctx.lineWidth=2.5;ctx.shadowBlur=14;ctx.globalAlpha=0.9*pulse;
    ctx.beginPath();ctx.ellipse(pz.x,pz.y,pr2*0.8,pr2*0.32,0,0,6.28);ctx.stroke();
    ctx.restore();
    // ▼マーカー(大きく・くっきり)
    ctx.save();
    const ay=Math.sin(G.time*6)*5*s;
    ctx.fillStyle='#00ffb3';ctx.shadowColor='#00ffb3';ctx.shadowBlur=18;
    ctx.font=`900 ${36*s}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('▼',pz.x,pz.y-60*s+ay);
    ctx.restore();

    ctx.fillStyle='rgba(10,5,25,0.9)';ctx.strokeStyle='#ffd54f';ctx.lineWidth=1.5*s;
    ctx.shadowColor='#ffd54f';ctx.shadowBlur=8;

    ctx.fillRect(pz.x-w2,pz.y-140*s,w2*2,34*s);ctx.strokeRect(pz.x-w2,pz.y-140*s,w2*2,34*s);
    ctx.fillStyle='#ffd54f';ctx.font=`900 ${19*s}px "Hiragino Kaku Gothic ProN",sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('銀河複合企業ネオン・バーガー(株) DRIVE-THRU',pz.x,pz.y-123*s);

    ctx.fillStyle=reveal?'#00ffb3':'#ff2bd6';

    ctx.restore();
  }

function drawShop(g,side,open,reveal){
  const pz=proj(g.t,side*(ROAD_EDGE+130));

  // 本体
  ctx.fillStyle='rgba(15,8,30,0.94)';
  ctx.strokeStyle=col;ctx.lineWidth=2.5*s;ctx.shadowColor=col;ctx.shadowBlur=12*s;
  ctx.fillRect(-w2,-h2,w2*2,h2);ctx.strokeRect(-w2,-h2,w2*2,h2);

  const wx=face*w2*0.5;
  ctx.fillStyle='rgba(255,240,180,0.28)';
  ctx.strokeStyle=col;ctx.lineWidth=1.5*s;
  ctx.fillRect(wx-19*s,-56*s,38*s,38*s);ctx.strokeRect(wx-19*s,-56*s,38*s,38*s);

  ctx.beginPath();ctx.moveTo(wx,-36*s);ctx.lineTo(wx,-26*s);ctx.stroke();

  ctx.beginPath();ctx.moveTo(wx,-33*s);ctx.lineTo(wx+face*11*s,-40*s+wave);ctx.stroke();
  // 屋上のポールサイン(メニュー名)

  const sw=Math.max(80*s,label.length*16*s+18*s);
  ctx.strokeStyle='rgba(120,130,170,0.9)';ctx.lineWidth=2.5*s;
  ctx.beginPath();ctx.moveTo(0,-h2-11*s);ctx.lineTo(0,-h2-34*s);ctx.stroke();
  const pu=0.75+0.25*Math.sin(G.time*3);
  ctx.fillStyle='rgba(10,5,20,0.94)';ctx.strokeStyle=col;ctx.lineWidth=2*s;
  ctx.shadowColor=col;ctx.shadowBlur=12*pu;
  ctx.fillRect(-sw/2,-h2-58*s,sw,26*s);ctx.strokeRect(-sw/2,-h2-58*s,sw,26*s);
  ctx.shadowBlur=0;
  if(s>0.32){
    ctx.fillStyle=col;ctx.font=`900 ${16*s}px "Hiragino Kaku Gothic ProN",sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(label,0,-h2-45*s);
    // 壁のOPEN/CLOSEDサイン
    ctx.font=`900 ${15*s}px sans-serif`;
    ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=8;
    ctx.fillText(reveal?(open?'OPEN':'CLOSED'):'?',-face*w2*0.45,-h2*0.75);
  }
  // 受け取りアーム(開店側のみ: 窓から端レーンへトレイが伸びる)
  if(open&&reveal){
    const lanePz=proj(g.t,g.correct*LANE_W);
    ctx.strokeStyle='#ffd54f';ctx.lineWidth=2.5*s;ctx.shadowColor='#ffd54f';ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(wx+face*19*s,-37*s);

    const bx=lanePz.x-pz.x;
    ctx.fillStyle='#ffd54f';
    ctx.beginPath();ctx.arc(bx,-34*s+Math.sin(G.time*5)*3*s,5*s,0,6.28);ctx.fill();
  }
  ctx.restore();
}
function drawBuilding(g){
  const pz=proj(g.t,0);
  const s=pz.s;
  ctx.save();ctx.translate(pz.x,pz.y);
  if(!g.exploded){
    const w2=270*s,h2=170*s;
    ctx.fillStyle='rgba(12,6,26,0.96)';
    ctx.strokeStyle='#ff5252';ctx.lineWidth=2.5*s;
    ctx.shadowColor='#ff5252';ctx.shadowBlur=12*s;
    ctx.fillRect(-w2,-h2,w2*2,h2);ctx.strokeRect(-w2,-h2,w2*2,h2);
    // 窓
    ctx.fillStyle=css(G.col.acc,0.45);
    for(let wy=-h2+10*s;wy<-8*s;wy+=16*s)for(let wx=-w2+10*s;wx<w2-10*s;wx+=20*s)
      if(((wx*3+wy*7)|0)%3)ctx.fillRect(wx,wy,8*s,6*s);
    // 社名+警告
    if(s>0.3){
      ctx.fillStyle='#ff5252';ctx.font=`900 ${20*s}px "Hiragino Kaku Gothic ProN",sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(g.name,0,-h2+20*s);
      if((G.time*4|0)%2){ctx.fillStyle='#ffd54f';ctx.font=`900 ${24*s}px "Hiragino Kaku Gothic ProN",sans-serif`;ctx.fillText('⚠ 進路封鎖 ⚠',0,-h2*0.5);}
    }
    // ロックオン照準(ロケット発射後・着弾まで)
    if(g.fired){
      const pu=1+0.15*Math.sin(G.time*18);
      const rr=60*s*pu;
      ctx.save();ctx.translate(0,-h2*0.5);
      ctx.strokeStyle='#ff2b4e';ctx.lineWidth=3*s;
      ctx.shadowColor='#ff2b4e';ctx.shadowBlur=16;
      ctx.beginPath();ctx.arc(0,0,rr,0,6.28);ctx.stroke();
      for(let i=0;i<4;i++){
        const a=i*Math.PI/2+G.time*3;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*rr*0.75,Math.sin(a)*rr*0.75);
        ctx.lineTo(Math.cos(a)*rr*1.2,Math.sin(a)*rr*1.2);
        ctx.stroke();
      }
      if((G.time*6|0)%2){
        ctx.fillStyle='#ff2b4e';ctx.font=`900 ${19*s}px sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('LOCK-ON',0,-rr-16*s);
      }
      ctx.restore();
    }
  }else{
    // 瓦礫(燃えながら崩れる)
    const fade=Math.max(0,1-g.expT/1.4);
    ctx.globalAlpha=fade;
    for(let k=0;k<12;k++){
      const rx=rndSeeded(k*3.3)*520-260,rh=rndSeeded(k*7.7)*26+6;
      ctx.fillStyle='rgba(40,30,50,0.85)';
      ctx.fillRect(rx*s,-rh*s,26*s,rh*s);
      if(k%3===0){ // 残り火
        ctx.fillStyle=`rgba(255,${120+80*Math.sin(G.time*9+k)},40,${fade*0.8})`;
        ctx.fillRect(rx*s+8*s,-rh*s-3*s,7*s,4*s);
      }
    }
  }
  ctx.restore();
}
