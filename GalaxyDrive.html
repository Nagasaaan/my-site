  // ドーム
  ctx.beginPath();ctx.arc(0,-9,16,Math.PI,0);
  const dg=cachedGrad('pdome','static',()=>{
    const dg=ctx.createLinearGradient(0,-25,0,-6);
    dg.addColorStop(0,'rgba(0,229,255,0.9)');dg.addColorStop(1,'rgba(0,229,255,0.25)');
    return dg;
  });
  ctx.fillStyle=dg;ctx.fill();
  ctx.strokeStyle='#00e5ff';ctx.lineWidth=2;ctx.stroke();
  // 中の宇宙人
  ctx.fillStyle='#aaffcc';
  ctx.beginPath();ctx.arc(0,-12,5,0,6.28);ctx.fill();
  ctx.fillStyle='#052';ctx.fillRect(-3,-14,2,2);ctx.fillRect(1,-14,2,2);
  // ネオンリング灯
  for(let i=-2;i<=2;i++){
    const on=((G.time*8|0)+i)%5===0;
    ctx.fillStyle=on?'#ffffff':(G.bonus?'#ffd54f':'#ff2bd6');
    ctx.shadowBlur=on?12:6;
    ctx.beginPath();ctx.arc(i*16,6,3,0,6.28);ctx.fill();
  }
  // シールド
  if(p.shield){
    ctx.strokeStyle='rgba(0,229,255,0.7)';ctx.lineWidth=2;
    ctx.shadowColor='#00e5ff';ctx.shadowBlur=14;
    ctx.beginPath();ctx.ellipse(0,-4,52,30,0,0,6.28);ctx.stroke();
  }
  ctx.restore();
  // ブースト残像
  if(G.pw.boost>0||G.bonus){
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let i=1;i<=3;i++){
      ctx.globalAlpha=0.12/i;
      ctx.strokeStyle=G.bonus?'#ffd54f':'#ff9100';ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(x,y+bob+i*10,42+i*4,14,0,0,6.28);ctx.stroke();
    }
    ctx.restore();
  }
}
function drawParticles(){
  for(const q of G.parts){
    ctx.save();
    if(q.add)ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=clamp(q.life,0,1);
    if(q.fire){ // 火球: 放射グラデーションの発光球
      const r2=q.size*(1.4-q.life*0.4);
      const fg=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,r2);
      fg.addColorStop(0,'rgba(255,255,240,0.95)');
      fg.addColorStop(0.35,q.col);
      fg.addColorStop(1,'rgba(255,60,10,0)');
      ctx.fillStyle=fg;
      ctx.beginPath();ctx.arc(q.x,q.y,r2,0,6.28);ctx.fill();
    }else{
      ctx.fillStyle=q.col;ctx.shadowColor=q.col;ctx.shadowBlur=6;
      ctx.fillRect(q.x-q.size/2,q.y-q.size/2,q.size,q.size);
    }
    ctx.restore();
  }
}
function drawRings(){ // 爆発の衝撃波リング
  if(!G.rings.length)return;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const r2 of G.rings){
    ctx.globalAlpha=clamp(r2.life*1.6,0,1);
    ctx.strokeStyle=r2.col;ctx.lineWidth=r2.lw||4;
    ctx.shadowColor=r2.col;ctx.shadowBlur=18;
    ctx.beginPath();ctx.ellipse(r2.x,r2.y,r2.r,r2.r*0.55,0,0,6.28);ctx.stroke();
  }
  ctx.restore();
}

// ---------- HUD & オーバーレイ ----------
function drawHUD(){
  if(G.state==='title'){drawTitle();return;}
  const p=G.player;
  // スコア
  neonText(`SCORE ${G.score}/42`,18,32,30,'#00e5ff','left');
  // ゾーン・レベル
  neonText(`ZONE ${G.zoneIdx+1} ${ZONES[G.zoneIdx].name}`,W-18,28,20,'#ff2bd6','right');
  // 距離・タイム
  ctx.save();ctx.font='700 17px sans-serif';ctx.fillStyle='rgba(255,255,255,0.8)';ctx.textAlign='center';
  ctx.fillText(`${(G.dist|0)}m   TIME ${fmtTime(G.time)}${G.answered?'  [42到達 '+fmtTime(G.t42)+']':''}`,W/2,22);
  ctx.restore();
  // HP
  ctx.save();
  ctx.font='21px sans-serif';ctx.textAlign='left';
  for(let i=0;i<3;i++){
    ctx.fillStyle=i<p.hp?'#ff2b4e':'rgba(255,255,255,0.15)';
    ctx.shadowColor='#ff2b4e';ctx.shadowBlur=i<p.hp?8:0;
    ctx.fillText('♥',16+i*26,60);
  }
  ctx.restore();
  if(p.shield)neonText('◎SHIELD',118,56,15,'#00e5ff','left');
  if(G.combo>0)neonText(`COMBO ${G.combo}`,W-18,54,16,'#ffd54f','right');
  // パワーアップゲージ
  const gauges=[['boost','#ff9100','ブースト',6],['magnet','#ff2bd6','マグネット',8],['slow','#7c4dff','スロー',5]];
  let gy=H-22;
  for(const[k,col,label,max]of gauges){
    if(G.pw[k]>0){
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(16,gy-11,150,14);
      ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=6;
      ctx.fillRect(16,gy-11,150*(G.pw[k]/max),14);
      ctx.font='700 14px sans-serif';ctx.fillStyle='#fff';ctx.textAlign='left';
      ctx.fillText(label,174,gy+1);
      ctx.restore();
      gy-=22;
    }
  }
  // 浮遊テキスト
  for(const t of G.texts){
    ctx.save();ctx.globalAlpha=clamp(t.life,0,1);
    neonText(t.txt,t.x,t.y,24,t.col);
    ctx.restore();
  }
  // キャプション(路肩実況)
  if(G.caption){
    ctx.save();
    ctx.globalAlpha=clamp(G.caption.t,0,1);
    ctx.fillStyle='rgba(5,2,15,0.78)';
    ctx.fillRect(0,H-70,W,40);
    ctx.font='700 21px "Hiragino Kaku Gothic ProN",sans-serif';
    ctx.fillStyle='#c8f8ff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(G.caption.txt,W/2,H-50);
    ctx.restore();
  }
  // ホログラム広告落下
  if(G.holo){
    const a=G.holo.t<0.3?G.holo.t/0.3:Math.max(0,1-(G.holo.t-1.6)/0.9);
    const y=lerp(-90,140,Math.min(1,G.holo.t/0.4));
    ctx.save();ctx.globalAlpha=a*0.85;
    ctx.fillStyle='rgba(0,229,255,0.12)';
    ctx.strokeStyle='#00e5ff';ctx.lineWidth=2;ctx.shadowColor='#00e5ff';ctx.shadowBlur=16;
    ctx.fillRect(W/2-330,y,660,84);ctx.strokeRect(W/2-330,y,660,84);
    ctx.font='900 23px "Hiragino Kaku Gothic ProN",sans-serif';ctx.fillStyle='#dffcff';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('【広告】'+G.holo.txt,W/2,y+42);
    ctx.restore();
  }
}
function drawOverlays(){
  // フラッシュ
  if(G.flash>0){
    ctx.save();ctx.globalAlpha=G.flash*0.6;
    ctx.fillStyle=G.flashCol;ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  // ゾーンクリア
  if(G.zoneFx>0){
    const a=Math.min(1,G.zoneFx/0.5)*Math.min(1,(2.6-G.zoneFx)/0.3+0.01);
    ctx.save();ctx.globalAlpha=clamp(a,0,1);
    neonText('ZONE CLEAR',W/2,H*0.34,42,'#00ffb3');
    neonText(`${G.zoneFxName} 突破`,W/2,H*0.34+44,18,'#ffffff');
    if(G.zoneFxBonus)neonText('ノーミスボーナス +2',W/2,H*0.34+74,16,'#ffd54f');
    ctx.restore();
  }
  // 42演出(ゲームを止めずにテキストのみ重ねる)
  if(G.fx42>0){
    const t=6-G.fx42;
    const fade=Math.min(1,t*3)*clamp(G.fx42/0.8,0,1);
    ctx.save();ctx.globalAlpha=fade;
    const sc=t<0.5?lerp(2.6,1,t/0.5):1+Math.sin(t*3)*0.03;
    ctx.translate(W/2,H*0.3);ctx.scale(sc,sc);
    neonText('42',0,0,130,'#ffd54f');
    ctx.restore();
    if(t>0.7){
      ctx.save();ctx.globalAlpha=clamp((t-0.7)/0.5,0,1)*clamp(G.fx42/0.8,0,1);
      neonText('生命、宇宙、そして万物についての究極の答えに到達しました。',W/2,H*0.52,25,'#00e5ff');
      neonText('……で、質問は何だっけ?',W/2,H*0.52+40,21,'#ffffff');
      if(G.newRec.t42)neonText(`最速記録更新! ${fmtTime(G.t42)}`,W/2,H*0.52+78,22,'#ffd54f');
      ctx.restore();
    }
  }
  if(G.bonus&&G.state==='playing'){
    ctx.save();ctx.globalAlpha=0.6+0.4*Math.sin(G.time*4);
    neonText('BONUS FLIGHT',W/2,54,16,'#ffd54f');
    ctx.restore();
  }
  // ゲームオーバー
  if(G.state==='gameover'){
    ctx.save();
    ctx.fillStyle='rgba(5,2,15,0.72)';ctx.fillRect(0,0,W,H);
    neonText('GAME OVER',W/2,H*0.26,52,'#ff2b4e');
    neonText(`SCORE  ${G.score} / 42${G.newRec.score?'  NEW!':''}`,W/2,H*0.4,27,'#00e5ff');
    neonText(`距離  ${G.dist|0} m`,W/2,H*0.4+44,22,'#ffffff');
    neonText(`タイム  ${fmtTime(G.time)}`,W/2,H*0.4+78,22,'#ffffff');
    if(G.answered)neonText(`42到達タイム ${fmtTime(G.t42)}${G.newRec.t42?'  ★最速更新!':''}`,W/2,H*0.4+114,20,'#ffd54f');
    neonText(`ハイスコア ${best.score}   ベスト距離 ${best.dist|0}m`,W/2,H*0.4+152,17,'#ff2bd6');
    if(best.t42!=null)neonText(`42最速 ${fmtTime(best.t42)}`,W/2,H*0.4+180,17,'#ffd54f');
    if((G.time*2|0)%2)neonText('SPACE / タップ でリトライ',W/2,H*0.88,21,'#ffffff');
    ctx.restore();
  }
}
function drawTitle(){
  ctx.save();
  ctx.fillStyle='rgba(5,2,15,0.35)';ctx.fillRect(0,0,W,H);
  const wob=Math.sin(G.time*2)*4;
  neonText('RETROWAVE',W/2,H*0.22+wob,68,'#ff2bd6');
  neonText('GALAXY DRIVE',W/2,H*0.22+70+wob,56,'#00e5ff');
  neonText('〜 宇宙UFOドライブスルー 〜',W/2,H*0.22+128,20,'#ffd54f');
  ctx.font='700 20px "Hiragino Kaku Gothic ProN",sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.textAlign='center';
  ctx.fillText('←→ / A D キー or 画面タップで左右移動',W/2,H*0.56);
  ctx.fillText('結晶を集め、ドライブスルーはお店に接するレーンへ',W/2,H*0.56+30);
  ctx.fillText('目指せ、究極の答え「42」',W/2,H*0.56+60);
  neonText(`ハイスコア ${best.score}/42   ベスト距離 ${best.dist|0}m`,W/2,H*0.76,19,'#ff2bd6');
  if(best.t42!=null)neonText(`42最速タイム ${fmtTime(best.t42)}`,W/2,H*0.76+30,19,'#ffd54f');
  if((G.time*2|0)%2)neonText('SPACE / タップ でスタート',W/2,H*0.88,25,'#ffffff');
  ctx.restore();
}
// スキャンライン+ビネット: 静的な加工なので起動時に1枚へ焼き込み、毎フレームは貼るだけ
const postCv=document.createElement('canvas');postCv.width=W;postCv.height=H;
{
  const c=postCv.getContext('2d');
  const scanCv=document.createElement('canvas');scanCv.width=1;scanCv.height=3;
  const sc2=scanCv.getContext('2d');sc2.fillStyle='rgba(0,0,0,0.16)';sc2.fillRect(0,0,1,1);
  c.fillStyle=c.createPattern(scanCv,'repeat');c.fillRect(0,0,W,H);
  const v=c.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.75);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(5,0,20,0.5)');
  c.fillStyle=v;c.fillRect(0,0,W,H);
}
function drawScanlines(){
  ctx.drawImage(postCv,0,0);
}
function drawGlitch(){
  for(let i=0;i<4;i++){
    const y=rnd(0,H-20),h2=rnd(4,16),off=rnd(-24,24)*G.glitch;
    ctx.drawImage(cv,0,y,W,h2,off,y,W,h2);
  }
}

// ---------- 入力 ----------
function startGame(){
  initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  const keepBest=best;
  reset();
  best=keepBest;
  G.state='playing';
  if(AC)bgm.next=AC.currentTime+0.1;
}
function move(dir){
  if(G.state!=='playing')return;
  G.player.lane=clamp(G.player.lane+dir,-LANE_MAX,LANE_MAX);
}
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);
  else if(e.code==='ArrowRight'||e.code==='KeyD')move(1);
  else if(e.code==='Space'||e.code==='Enter'){
    if(G.state==='title'||G.state==='gameover')startGame();
  }
});
let touchX=null;
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*W;
  if(G.state==='title'||G.state==='gameover'){startGame();return;}
  touchX=x;
  move(x<W/2?-1:1);
});
cv.addEventListener('pointerup',()=>{touchX=null;});

// ---------- リサイズ ----------
function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
}
addEventListener('resize',fit);fit();

// ---------- メインループ ----------
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
